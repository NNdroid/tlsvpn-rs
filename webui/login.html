<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TLSVPN · Login</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#18202a;--sub:#667085;--line:#d8dee8;--accent:#3478f6;--danger:#d92d20} @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b23;--text:#e6edf3;--sub:#8b949e;--line:#30363d;--accent:#58a6ff;--danger:#ff7b72}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(420px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 16px 48px #0002}.brand{font-size:25px;font-weight:750;letter-spacing:-.5px}.sub{color:var(--sub);margin:7px 0 25px}.field{margin:14px 0}label{display:block;margin-bottom:7px;font-weight:600}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}button[type=submit]{width:100%;border:0;border-radius:10px;padding:12px;margin-top:9px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.err{min-height:20px;color:var(--danger);margin-top:12px}.langs{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}.langs button{border:0;background:none;color:var(--sub);cursor:pointer;padding:3px}.langs button.active{color:var(--accent);font-weight:700}
</style>
  <link rel="icon" href="/favicon.ico" sizes="any">
</head><body><main class="card"><div class="brand">TLSVPN</div><div class="sub" id="subtitle"></div><form id="login"><div class="field"><label id="userLabel" for="username"></label><input id="username" autocomplete="username" autofocus required></div><div class="field"><label id="passLabel" for="password"></label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit" type="submit"></button><div class="err" id="error" role="alert"></div></form><div class="langs" id="langs"></div></main>
<script>
const I={
'en':{sub:'Management dashboard',u:'Username',p:'Password',go:'Sign in',bad:'Invalid username or password',wait:'Signing in…'},
'fr':{sub:'Tableau de gestion',u:'Nom d’utilisateur',p:'Mot de passe',go:'Se connecter',bad:'Nom d’utilisateur ou mot de passe incorrect',wait:'Connexion…'},
'de':{sub:'Verwaltungsoberfläche',u:'Benutzername',p:'Passwort',go:'Anmelden',bad:'Benutzername oder Passwort ungültig',wait:'Anmeldung…'},
'zh-CN':{sub:'管理面板',u:'用户名',p:'密码',go:'登录',bad:'用户名或密码错误',wait:'正在登录…'},
'zh-TW':{sub:'管理面板',u:'使用者名稱',p:'密碼',go:'登入',bad:'使用者名稱或密碼錯誤',wait:'正在登入…'},
'ja':{sub:'管理ダッシュボード',u:'ユーザー名',p:'パスワード',go:'ログイン',bad:'ユーザー名またはパスワードが正しくありません',wait:'ログイン中…'}};
const names={'en':'English','fr':'Français','de':'Deutsch','zh-CN':'简体中文','zh-TW':'繁體中文','ja':'日本語'};let lang=localStorage.getItem('tlsvpn.lang')||navigator.language;if(!I[lang])lang=lang.startsWith('zh')?'zh-CN':lang.startsWith('de')?'de':lang.startsWith('fr')?'fr':lang.startsWith('ja')?'ja':'en';
function render(){const x=I[lang];document.documentElement.lang=lang;subtitle.textContent=x.sub;userLabel.textContent=x.u;passLabel.textContent=x.p;submit.textContent=x.go;langs.innerHTML='';Object.keys(I).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=names[k];b.className=k===lang?'active':'';b.onclick=()=>{lang=k;localStorage.setItem('tlsvpn.lang',k);render()};langs.appendChild(b)})}render();
login.onsubmit=async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent=I[lang].wait;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(!r.ok){error.textContent=I[lang].bad;password.select();return}location.replace('/')}catch(_){error.textContent=I[lang].bad}finally{submit.disabled=false;submit.textContent=I[lang].go}};
</script></body></html>
