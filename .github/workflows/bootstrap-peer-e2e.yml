name: Finalize peer metadata session refresh

on:
  push:
    branches: ["feat/peer-info-handshake"]
    paths: [".github/workflows/bootstrap-peer-e2e.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/peer-info-handshake
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Clear stale peer metadata on rolling downgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.rs')
          s = p.read_text()
          old = '''    if let Some(peer) = req.peer_info.as_ref() {\n        *c_sess.peer_info.write() = Some(normalize_peer_info(peer));\n    }\n'''
          new = '''    // peer_info describes the peer on this authenticated handshake. During a\n    // rolling downgrade an older client omits it, so clear metadata retained\n    // from the previous connection instead of showing a stale host identity.\n    *c_sess.peer_info.write() = req.peer_info.as_ref().map(normalize_peer_info);\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one peer refresh block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Test feature branch
        run: cargo test --all --all-targets

      - name: Commit production fix
        run: |
          git config user.name NNdroid
          git config user.email 99177648+NNdroid@users.noreply.github.com
          git add src/server.rs
          git commit -m "fix(protocol): clear stale peer metadata on reconnect"
          git push origin HEAD:feat/peer-info-handshake
