name: Finalize WebUI parity and installer

on:
  push:
    branches: [feat/webui-install-parity]

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref_name == 'feat/webui-install-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-install-parity
          fetch-depth: 0

      - name: Apply final reviewed fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} match(es), got {n}: {old[:100]!r}")
              p.write_text(s.replace(old, new, count))

          # API: sample independently of browser requests, expose persisted traffic,
          # honor trend ranges, and hot-apply traffic accounting parameters.
          rep('src/api.rs', '                ctx.web.observe_stats(&stats);\n', '')
          rep('src/api.rs', '''                    obj.insert("brutal_system".to_string(), brutal_system_status());
                }
''', '''                    obj.insert("brutal_system".to_string(), brutal_system_status());
                    obj.insert("traffic".to_string(), ctx.web.traffic_json());
                    let client_traffic = ctx.web.client_traffic_json();
                    if client_traffic.as_array().map_or(false, |v| !v.is_empty()) {
                        obj.insert("client_traffic".to_string(), client_traffic);
                    }
                }
''')
          rep('src/api.rs', '''            (&Method::Get, "/api/trend") => {
                respond_json(request, ctx.web.trend_json().to_string(), 200);
            }
''', '''            (&Method::Get, "/api/trend") => {
                let range = request
                    .url()
                    .split_once('?')
                    .and_then(|(_, q)| q.split('&').find_map(|kv| kv.strip_prefix("range=")))
                    .unwrap_or("2m");
                respond_json(request, ctx.web.trend_json(range).to_string(), 200);
            }
''')
          rep('src/api.rs', '''                                "pad_mode" => {
                                    let _ =
                                        provider.control("pad_mode", "", &validated.pad_mode, 0);
                                }
                                _ => needs_restart.push(field.clone()),
''', '''                                "pad_mode" => {
                                    let _ =
                                        provider.control("pad_mode", "", &validated.pad_mode, 0);
                                }
                                "traffic_days" | "traffic_file" => {}
                                _ => needs_restart.push(field.clone()),
''')
          rep('src/api.rs', '''                        if let Some(cfg) = ctx.cfg.write().as_object_mut() {
                            cfg.insert("log_level".into(), json!(validated.loglevel));
''', '''                        ctx.web
                            .apply_traffic_config(validated.traffic_days, &validated.traffic_file);
                        if let Some(cfg) = ctx.cfg.write().as_object_mut() {
                            cfg.insert("log_level".into(), json!(validated.loglevel));
''')
          marker = '''/// web.bind=all：直接启动单个 listener（默认行为，不变）。stop 永不置位。
pub fn start_web_server('''
          sampler = '''/// Start the process-level dashboard/traffic sampler exactly once. It runs even
/// when the HTTP dashboard is disabled so traffic_days/traffic_file keep the same
/// process-level semantics as the Go implementation.
pub fn start_dashboard_sampler(
    provider: Arc<dyn WebStatsProvider>,
    ctx: Arc<RuntimeCtx>,
) {
    if !ctx.web.try_start_sampler() {
        return;
    }
    std::thread::spawn(move || loop {
        ctx.web.observe_stats(&provider.stats_json());
        std::thread::sleep(Duration::from_secs(1));
    });
}

/// web.bind=all：直接启动单个 listener（默认行为，不变）。stop 永不置位。
pub fn start_web_server('''
          rep('src/api.rs', marker, sampler)

          # Server/client statistics must feed the shared Go WebUI counters.
          rep('src/server.rs', '''        let total_conns: usize = sessions
            .values()
            .map(|s| s.stat.active_conns.load(Ordering::Relaxed).max(0) as usize)
            .sum();
''', '''        let total_conns: usize = sessions
            .values()
            .map(|s| s.stat.active_conns.load(Ordering::Relaxed).max(0) as usize)
            .sum();
        let global_tx_bytes: u64 = sessions
            .values()
            .map(|s| s.stat.tx_bytes.load(Ordering::Relaxed))
            .sum();
        let global_rx_bytes: u64 = sessions
            .values()
            .map(|s| s.stat.rx_bytes.load(Ordering::Relaxed))
            .sum();
''')
          rep('src/server.rs', '''            "global_tx_bytes": 0,
            "global_rx_bytes": 0,
''', '''            "global_tx_bytes": global_tx_bytes,
            "global_rx_bytes": global_rx_bytes,
''')
          rep('src/client.rs', '''            "global_tx_bytes": 0,
            "global_rx_bytes": 0,
''', '''            "global_tx_bytes": self.tx_bytes.load(Ordering::Relaxed),
            "global_rx_bytes": self.rx_bytes.load(Ordering::Relaxed),
''')
          rep('src/server.rs', '''    if !args.web.is_empty() {
''', '''    crate::api::start_dashboard_sampler(core.clone(), ctx.clone());

    if !args.web.is_empty() {
''', 1)
          rep('src/client.rs', '''    if !args.web.is_empty() {
''', '''    crate::api::start_dashboard_sampler(client.clone(), ctx.clone());

    if !args.web.is_empty() {
''', 1)

          # Shared root examples now carry the shared traffic configuration fields.
          for path in ('config.server.json', 'config.client.json'):
              rep(path, '''  "brutal_down": 500,
''', '''  "brutal_down": 500,
  "traffic_days": 30,
  "traffic_file": "",
''')

          # Installer safety/compatibility and lego v5 support.
          p = Path('scripts/install.sh')
          s = p.read_text()
          old = '''        if [[ "$MODE" == "server" && ( "$CERT_MODE" == "lego" || "$CERT_MODE" == "self-signed" ) ]]; then
          v="$(prompt_value "Certificate DNS name or IP" "$CERT_NAME")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; CERT_NAME="$v"
          if [[ "$CERT_MODE" == "lego" ]]; then v="$(prompt_value "ACME account email" "$EMAIL")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; EMAIL="$v"; fi
        fi
'''
          new = '''        if [[ "$MODE" == "server" && ( "$CERT_MODE" == "lego" || "$CERT_MODE" == "self-signed" ) ]]; then
          v="$(prompt_value "Certificate DNS name or IP" "$CERT_NAME")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; CERT_NAME="$v"
          if [[ "$CERT_MODE" == "lego" ]]; then v="$(prompt_value "ACME account email" "$EMAIL")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; EMAIL="$v"; fi
        elif [[ "$MODE" == "server" && "$CERT_MODE" == "existing" ]]; then
          v="$(prompt_value "Existing certificate file" "$CERT_FILE")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; CERT_FILE="$v"
          v="$(prompt_value "Existing private key file" "$KEY_FILE")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; KEY_FILE="$v"
        fi
'''
          if s.count(old) != 1: raise SystemExit('installer: cert wizard block mismatch')
          s = s.replace(old, new, 1)

          old = '''install_lego() {
  have lego && return 0
  local lego_arch
'''
          new = '''lego_major() {
  have lego || { printf '0'; return; }
  lego --version 2>/dev/null | grep -oE 'v?[0-9]+\\.[0-9]+\\.[0-9]+' | head -n1 | sed -E 's/^v?([0-9]+).*/\\1/'
}

install_lego() {
  local old_major="$(lego_major)"
  [[ "$old_major" =~ ^[0-9]+$ ]] || old_major=0
  if (( old_major >= 5 )); then return 0; fi
  local lego_arch
'''
          if s.count(old) != 1: raise SystemExit('installer: install_lego header mismatch')
          s = s.replace(old, new, 1)
          old = '''  /usr/local/bin/lego --version >/dev/null
}

lego_args() {
  local action="$1"
  LEGO_ARGS=(--path "$LEGO_HOME" --email "$EMAIL" --accept-tos --server "$ACME_SERVER" --domains "$CERT_NAME" --cert.name tlsvpn)
  if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--profile shortlived); fi
  case "$ACME_CHALLENGE" in
    http) LEGO_ARGS+=(--http --http.port :80) ;;
    tls) LEGO_ARGS+=(--tls --tls.port :443) ;;
  esac
  LEGO_ARGS+=("$action")
}
'''
          new = '''  /usr/local/bin/lego --version >/dev/null
  if (( old_major > 0 && old_major < 5 )) && [[ -d "$LEGO_HOME" ]] && find "$LEGO_HOME" -mindepth 1 -print -quit 2>/dev/null | grep -q .; then
    info "Migrating lego v4 state to v5 format"
    /usr/local/bin/lego migrate --path "$LEGO_HOME"
  fi
}

lego_args() {
  LEGO_ARGS=(run --path "$LEGO_HOME" --email "$EMAIL" --accept-tos --server "$ACME_SERVER" --domains "$CERT_NAME" --cert.name tlsvpn)
  if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--profile shortlived); fi
  case "$ACME_CHALLENGE" in
    http) LEGO_ARGS+=(--http --http.address :80) ;;
    tls) LEGO_ARGS+=(--tls --tls.address :443) ;;
  esac
}
'''
          if s.count(old) != 1: raise SystemExit('installer: lego args block mismatch')
          s = s.replace(old, new, 1)
          s = s.replace('''  lego_args run
''', '''  lego_args
''', 1)
          s = s.replace('''  lego_args renew
  # IP certificates use the short-lived profile; renew while at least two days remain.
  if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--days 2); else LEGO_ARGS+=(--days 30); fi
''', '''  lego_args
  # IP certificates are ~6-day short-lived certificates, so check them daily and
  # renew with a two-day threshold. Normal DNS certificates keep a wider threshold.
  if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--renew-days 2); else LEGO_ARGS+=(--renew-days 30); fi
''', 1)
          # Do not put traffic fields in generated install configs until every currently
          # published release accepts them; the running binary supplies the same defaults.
          s = s.replace('''  "traffic_days": 30,
  "traffic_file": "$CONFIG_DIR/tlsvpn-traffic.json",
''', '', 2)
          old = '''  "$INSTALL_DIR/$PROGRAM" -c "$CONFIG_FILE.tmp" >/dev/null 2>&1 &
  local pid=$!; sleep 0.4; kill "$pid" >/dev/null 2>&1 || true; wait "$pid" >/dev/null 2>&1 || true
  mv -f "$CONFIG_FILE.tmp" "$CONFIG_FILE"
'''
          if s.count(old) != 1: raise SystemExit('installer: live validation block mismatch')
          s = s.replace(old, '''  mv -f "$CONFIG_FILE.tmp" "$CONFIG_FILE"
''', 1)
          old = '''MODE=$(printf '%q' "$MODE")
VERSION=$(printf '%q' "$VERSION")
ARCH=$(printf '%q' "$ARCH")
CONFIG_FILE=$(printf '%q' "$CONFIG_FILE")
'''
          new = '''MODE=$(printf '%q' "$MODE")
VERSION=$(printf '%q' "$VERSION")
ARCH=$(printf '%q' "$ARCH")
INSTALL_DIR=$(printf '%q' "$INSTALL_DIR")
CONFIG_DIR=$(printf '%q' "$CONFIG_DIR")
CERT_DIR=$(printf '%q' "$CERT_DIR")
INSTALLER_COPY=$(printf '%q' "$INSTALLER_COPY")
CONFIG_FILE=$(printf '%q' "$CONFIG_FILE")
'''
          if s.count(old) != 1: raise SystemExit('installer: state block mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # README: make the shared traffic contract and current auth behavior explicit.
          p = Path('README.md'); s = p.read_text()
          s = s.replace('''The wire-facing defaults are kept aligned with Go, but the full config surfaces differ. Rust-only `workers` and `mtu` belong only in Rust-specific files; Go-only `traffic_days` and `traffic_file` are not accepted by Rust.''', '''The wire-facing defaults are kept aligned with Go, but the full config surfaces differ. Rust-only `workers` and `mtu` belong only in Rust-specific files; `traffic_days` and `traffic_file` are shared with Go and drive the same persistent daily-traffic dashboard view.''')
          s = s.replace('''| `brutal_up` / `brutal_down` | `100` / `500` | — | Brutal rates in Mbps |
''', '''| `brutal_up` / `brutal_down` | `100` / `500` | — | Brutal rates in Mbps |
| `traffic_days` | `30` | — | Daily traffic retention in local-calendar days (`1`–`3650`), hot-applicable from the dashboard |
| `traffic_file` | `tlsvpn-traffic.json` beside the config | — | Persistent aggregate traffic store; per-client history uses the sibling `-clients.json` file |
''')
          s = s.replace('''Browser/API access uses HTTP Basic Auth from `web.auth`, and mutating control calls require `X-Requested-With: tlsvpn`.''', '''Browser access uses the same HttpOnly session-cookie login flow as Go; Basic Auth from `web.auth` remains accepted for scripts, and mutating control calls require `X-Requested-With: tlsvpn`.''')
          s = s.replace('''`/api/trend` keeps a live 1-second ring, `/api/events` provides SSE plus polling recovery,''', '''`/api/trend` keeps background 2-minute/1-hour/24-hour rings, `/api/events` provides SSE plus polling recovery, `/api/stats` includes persistent aggregate and per-client daily traffic,''')
          p.write_text(s)

          # Fix the AEAD workflow after WebUI assets moved out of src/api.rs.
          p = Path('.github/workflows/crypto-interop.yml'); s = p.read_text()
          if '      - "webui/app.js"\n' not in s:
              s = s.replace('''      - "src/api.rs"
''', '''      - "src/api.rs"
      - "webui/app.js"
''', 1)
          if s.count('src/api.rs') < 5:
              raise SystemExit('crypto workflow: expected four legacy grep targets plus path trigger')
          # Preserve the src/api.rs path trigger above; only grep command targets move.
          lines = s.splitlines()
          out = []
          for line in lines:
              if line.lstrip().startswith('grep -Fq ') and line.rstrip().endswith(' src/api.rs'):
                  line = line[:-len('src/api.rs')] + 'webui/app.js'
              out.append(line)
          p.write_text('\n'.join(out) + '\n')

          # Dashboard/installer regression assertions.
          p = Path('tests/dashboard_script_test.rs'); s = p.read_text()
          if 'rust_webui_exposes_go_traffic_and_background_trend_contract' not in s:
              s += '''

#[test]
fn rust_webui_exposes_go_traffic_and_background_trend_contract() {
    let root = Path::new(env!("CARGO_MANIFEST_DIR"));
    let api = fs::read_to_string(root.join("src/api.rs")).expect("api.rs");
    let server = fs::read_to_string(root.join("src/server.rs")).expect("server.rs");
    let client = fs::read_to_string(root.join("src/client.rs")).expect("client.rs");
    for marker in [
        "start_dashboard_sampler",
        "traffic_json",
        "client_traffic",
        "trend_json(range)",
        "apply_traffic_config",
    ] {
        assert!(api.contains(marker), "missing dashboard traffic/trend marker {marker}");
    }
    assert!(server.contains("global_tx_bytes: global_tx_bytes"));
    assert!(client.contains("self.tx_bytes.load(Ordering::Relaxed)"));
}

#[test]
fn installer_uses_safe_lego_v5_and_persists_custom_paths() {
    let installer = fs::read_to_string(
        Path::new(env!("CARGO_MANIFEST_DIR")).join("scripts/install.sh"),
    )
    .expect("install.sh");
    assert!(!installer.contains("-c \"$CONFIG_FILE.tmp\" >/dev/null 2>&1 &"));
    assert!(installer.contains("LEGO_ARGS=(run --path"));
    assert!(installer.contains("--renew-days"));
    assert!(installer.contains("--http.address"));
    assert!(installer.contains("--tls.address"));
    assert!(installer.contains("lego migrate --path"));
    for state_key in ["INSTALL_DIR=$(printf", "CONFIG_DIR=$(printf", "CERT_DIR=$(printf"] {
        assert!(installer.contains(state_key), "installer state missing {state_key}");
    }
}
'''
          p.write_text(s)
          PY

          git rm .github/workflows/finalize-webui-installer.yml

      - name: Validate
        shell: bash
        run: |
          chmod +x scripts/install.sh
          bash -n scripts/install.sh
          scripts/install.sh --help >/dev/null
          cargo fmt --check
          cargo test --all-targets
          cargo check --release
          grep -Fq 'webui/app.js' .github/workflows/crypto-interop.yml
          ! grep -Eq 'grep .*src/api\.rs' .github/workflows/crypto-interop.yml

      - name: Commit finalized implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete WebUI traffic parity and installer safety'
          git push origin HEAD:feat/webui-install-parity
