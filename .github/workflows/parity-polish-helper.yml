name: Traffic parity and installer polish helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/webui-install-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Complete traffic parity and installer safety
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count}, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count))

          # Server/client global counters feed the shared Go dashboard speed and traffic views.
          rep('src/server.rs', '''        let total_conns: usize = sessions\n            .values()\n            .map(|s| s.stat.active_conns.load(Ordering::Relaxed).max(0) as usize)\n            .sum();''', '''        let total_conns: usize = sessions\n            .values()\n            .map(|s| s.stat.active_conns.load(Ordering::Relaxed).max(0) as usize)\n            .sum();\n        let global_tx_bytes: u64 = sessions\n            .values()\n            .map(|s| s.stat.tx_bytes.load(Ordering::Relaxed))\n            .sum();\n        let global_rx_bytes: u64 = sessions\n            .values()\n            .map(|s| s.stat.rx_bytes.load(Ordering::Relaxed))\n            .sum();''')
          rep('src/server.rs', '''            "global_tx_bytes": 0,\n            "global_rx_bytes": 0,''', '''            "global_tx_bytes": global_tx_bytes,\n            "global_rx_bytes": global_rx_bytes,''')
          rep('src/client.rs', '''            "global_tx_bytes": 0,\n            "global_rx_bytes": 0,''', '''            "global_tx_bytes": self.tx_bytes.load(Ordering::Relaxed),\n            "global_rx_bytes": self.rx_bytes.load(Ordering::Relaxed),''')

          # Background sampling makes trend/traffic history independent of an open browser.
          rep('src/api.rs', '''            (&Method::Get, "/api/trend") => {\n                respond_json(request, ctx.web.trend_json().to_string(), 200);\n            }''', '''            (&Method::Get, "/api/trend") => {\n                let range = request\n                    .url()\n                    .split_once('?')\n                    .and_then(|(_, q)| q.split('&').find_map(|kv| kv.strip_prefix("range=")))\n                    .unwrap_or("2m");\n                respond_json(request, ctx.web.trend_json(range).to_string(), 200);\n            }''')
          rep('src/api.rs', '''                    obj.insert("brutal_system".to_string(), brutal_system_status());\n                }''', '''                    obj.insert("brutal_system".to_string(), brutal_system_status());\n                    obj.insert("traffic".to_string(), ctx.web.traffic_json());\n                    let client_traffic = ctx.web.client_traffic_json();\n                    if client_traffic.as_array().map_or(false, |v| !v.is_empty()) {\n                        obj.insert("client_traffic".to_string(), client_traffic);\n                    }\n                }''', 1)
          rep('src/api.rs', '''                                "pad_mode" => {\n                                    let _ =\n                                        provider.control("pad_mode", "", &validated.pad_mode, 0);\n                                }\n                                _ => needs_restart.push(field.clone()),''', '''                                "pad_mode" => {\n                                    let _ =\n                                        provider.control("pad_mode", "", &validated.pad_mode, 0);\n                                }\n                                "traffic_days" | "traffic_file" => {}\n                                _ => needs_restart.push(field.clone()),''')
          rep('src/api.rs', '''                        if let Some(cfg) = ctx.cfg.write().as_object_mut() {\n                            cfg.insert("log_level".into(), json!(validated.loglevel));''', '''                        ctx.web\n                            .apply_traffic_config(validated.traffic_days, &validated.traffic_file);\n                        if let Some(cfg) = ctx.cfg.write().as_object_mut() {\n                            cfg.insert("log_level".into(), json!(validated.loglevel));''')
          marker='''/// web.bind=all：直接启动单个 listener（默认行为，不变）。stop 永不置位。\npub fn start_web_server('''
          insert='''fn start_dashboard_sampler(\n    provider: Arc<dyn WebStatsProvider>,\n    ctx: Arc<RuntimeCtx>,\n) {\n    if !ctx.web.try_start_sampler() {\n        return;\n    }\n    std::thread::spawn(move || loop {\n        ctx.web.observe_stats(&provider.stats_json());\n        std::thread::sleep(Duration::from_secs(1));\n    });\n}\n\n/// web.bind=all：直接启动单个 listener（默认行为，不变）。stop 永不置位。\npub fn start_web_server('''
          rep('src/api.rs', marker, insert)
          rep('src/api.rs', '''    let stop = Arc::new(std::sync::atomic::AtomicBool::new(false));\n    std::thread::spawn(move || serve_listener(addr, auth, cert, key, provider, ctx, None, stop));''', '''    start_dashboard_sampler(provider.clone(), ctx.clone());\n    let stop = Arc::new(std::sync::atomic::AtomicBool::new(false));\n    std::thread::spawn(move || serve_listener(addr, auth, cert, key, provider, ctx, None, stop));''')
          rep('src/api.rs', '''pub fn start_web_server_tunnel(\n    bind_port: u16,\n    auth: String,\n    cert: String,\n    key: String,\n    provider: Arc<dyn WebStatsProvider>,\n    ctx: Arc<RuntimeCtx>,\n    source: Arc<dyn TunnelIpSource>,\n) {\n    std::thread::spawn(move || {''', '''pub fn start_web_server_tunnel(\n    bind_port: u16,\n    auth: String,\n    cert: String,\n    key: String,\n    provider: Arc<dyn WebStatsProvider>,\n    ctx: Arc<RuntimeCtx>,\n    source: Arc<dyn TunnelIpSource>,\n) {\n    start_dashboard_sampler(provider.clone(), ctx.clone());\n    std::thread::spawn(move || {''')

          # Root examples now include the Go traffic parameters because Rust accepts them too.
          for path in ['config.server.json','config.client.json']:
              rep(path, '''  "brutal_down": 500,\n''', '''  "brutal_down": 500,\n  "traffic_days": 30,\n  "traffic_file": "",\n''')

          # Installer: remain compatible with the newest release that may predate this PR,
          # preserve custom paths across maintenance, never start a live tunnel merely to
          # validate generated JSON, and use lego v5 command/renewal syntax.
          p=Path('scripts/install.sh'); s=p.read_text()
          s=s.replace('''  "traffic_days": 30,\n  "traffic_file": "$CONFIG_DIR/tlsvpn-traffic.json",\n''','',2)
          old='''  "$INSTALL_DIR/$PROGRAM" -c "$CONFIG_FILE.tmp" >/dev/null 2>&1 &\n  local pid=$!; sleep 0.4; kill "$pid" >/dev/null 2>&1 || true; wait "$pid" >/dev/null 2>&1 || true\n  mv -f "$CONFIG_FILE.tmp" "$CONFIG_FILE"'''
          if s.count(old)!=1: raise SystemExit('installer live-validation block not found')
          s=s.replace(old, '''  mv -f "$CONFIG_FILE.tmp" "$CONFIG_FILE"''',1)
          old='''MODE=$(printf '%q' "$MODE")\nVERSION=$(printf '%q' "$VERSION")\nARCH=$(printf '%q' "$ARCH")\nCONFIG_FILE=$(printf '%q' "$CONFIG_FILE")'''
          new='''MODE=$(printf '%q' "$MODE")\nVERSION=$(printf '%q' "$VERSION")\nARCH=$(printf '%q' "$ARCH")\nINSTALL_DIR=$(printf '%q' "$INSTALL_DIR")\nCONFIG_DIR=$(printf '%q' "$CONFIG_DIR")\nCERT_DIR=$(printf '%q' "$CERT_DIR")\nINSTALLER_COPY=$(printf '%q' "$INSTALLER_COPY")\nCONFIG_FILE=$(printf '%q' "$CONFIG_FILE")'''
          if s.count(old)!=1: raise SystemExit('installer state block not found')
          s=s.replace(old,new,1)
          old='''        if [[ "$MODE" == "server" && ( "$CERT_MODE" == "lego" || "$CERT_MODE" == "self-signed" ) ]]; then\n          v="$(prompt_value "Certificate DNS name or IP" "$CERT_NAME")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; CERT_NAME="$v"\n          if [[ "$CERT_MODE" == "lego" ]]; then v="$(prompt_value "ACME account email" "$EMAIL")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; EMAIL="$v"; fi\n        fi'''
          new='''        if [[ "$MODE" == "server" && ( "$CERT_MODE" == "lego" || "$CERT_MODE" == "self-signed" ) ]]; then\n          v="$(prompt_value "Certificate DNS name or IP" "$CERT_NAME")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; CERT_NAME="$v"\n          if [[ "$CERT_MODE" == "lego" ]]; then v="$(prompt_value "ACME account email" "$EMAIL")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; EMAIL="$v"; fi\n        elif [[ "$MODE" == "server" && "$CERT_MODE" == "existing" ]]; then\n          v="$(prompt_value "Existing certificate file" "$CERT_FILE")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; CERT_FILE="$v"\n          v="$(prompt_value "Existing private key file" "$KEY_FILE")"; [[ "$v" == "__BACK__" ]] && { step=5; continue; }; KEY_FILE="$v"\n        fi'''
          if s.count(old)!=1: raise SystemExit('installer cert wizard block not found')
          s=s.replace(old,new,1)
          old='''lego_args() {\n  local action="$1"\n  LEGO_ARGS=(--path "$LEGO_HOME" --email "$EMAIL" --accept-tos --server "$ACME_SERVER" --domains "$CERT_NAME" --cert.name tlsvpn)\n  if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--profile shortlived); fi\n  case "$ACME_CHALLENGE" in\n    http) LEGO_ARGS+=(--http --http.port :80) ;;\n    tls) LEGO_ARGS+=(--tls --tls.port :443) ;;\n  esac\n  LEGO_ARGS+=("$action")\n}'''
          new='''lego_args() {\n  local action="$1"\n  LEGO_ARGS=("$action" --path "$LEGO_HOME" --email "$EMAIL" --accept-tos --server "$ACME_SERVER" --domains "$CERT_NAME" --cert.name tlsvpn)\n  if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--profile shortlived); fi\n  case "$ACME_CHALLENGE" in\n    http) LEGO_ARGS+=(--http --http.address :80) ;;\n    tls) LEGO_ARGS+=(--tls --tls.address :443) ;;\n  esac\n}'''
          if s.count(old)!=1: raise SystemExit('installer lego_args block not found')
          s=s.replace(old,new,1)
          s=s.replace('''if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--days 2); else LEGO_ARGS+=(--days 30); fi''','''if is_ip "$CERT_NAME"; then LEGO_ARGS+=(--renew-days 2); else LEGO_ARGS+=(--renew-days 30); fi''',1)
          p.write_text(s)

          # Documentation must no longer call traffic fields Go-only.
          p=Path('README.md'); s=p.read_text()
          s=s.replace('''Rust-only `workers`/`mtu` are omitted so Go can read them; Go-only persisted traffic-accounting keys (`traffic_days`, `traffic_file`) must likewise be omitted from files intended for Rust because both implementations reject unknown fields.''','''Rust-only `workers`/`mtu` are omitted so Go can read the examples too. `traffic_days`/`traffic_file` are shared with Go and drive the same persistent daily-traffic view in the Rust dashboard.''')
          s=s.replace('''Rust adds `workers`/`mtu`, Go adds `traffic_days`/`traffic_file`, Rust currently supports only `client.interface_manager=self`, and Rust server mode requires an explicit certificate/key pair.''','''Rust adds `workers`/`mtu`; the Go traffic-accounting fields `traffic_days`/`traffic_file` are also accepted and implemented. Rust currently supports only `client.interface_manager=self`, and Rust server mode requires an explicit certificate/key pair.''')
          s=s.replace('''Rust-only `workers` and `mtu` belong only in Rust-specific files; Go-only `traffic_days` and `traffic_file` are not accepted by Rust.''','''Rust-only `workers` and `mtu` belong only in Rust-specific files; `traffic_days` and `traffic_file` are shared with Go and are hot-applied by the dashboard.''')
          s=s.replace('''`/api/trend` keeps a live 1-second ring, `/api/events` provides SSE plus polling recovery, and the settings editor''','''`/api/trend` keeps background 2-minute/1-hour/24-hour rings, `/api/events` provides SSE plus polling recovery, `/api/stats` includes persistent aggregate and per-client daily traffic, and the settings editor''')
          p.write_text(s)

          # Strengthen tests around the data contract and installer safety.
          p=Path('tests/dashboard_script_test.rs'); s=p.read_text()
          append=r'''\n#[test]\nfn rust_webui_exposes_go_traffic_and_background_trend_contract() {\n    let api = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/api.rs")).expect("api.rs");\n    let server = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/server.rs")).expect("server.rs");\n    let client = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/client.rs")).expect("client.rs");\n    for marker in ["start_dashboard_sampler", "traffic_json", "client_traffic", "trend_json(range)"] {\n        assert!(api.contains(marker), "missing dashboard traffic/trend marker {marker}");\n    }\n    assert!(server.contains("global_tx_bytes: global_tx_bytes"));\n    assert!(client.contains("self.tx_bytes.load(Ordering::Relaxed)"));\n}\n\n#[test]\nfn installer_does_not_start_tunnel_to_validate_generated_config() {\n    let installer = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("scripts/install.sh")).expect("install.sh");\n    assert!(!installer.contains("-c \"$CONFIG_FILE.tmp\" >/dev/null 2>&1 &"));\n    assert!(installer.contains("--renew-days"));\n    assert!(installer.contains("LEGO_ARGS=(\"$action\""));\n    for state_key in ["INSTALL_DIR=$(printf", "CONFIG_DIR=$(printf", "CERT_DIR=$(printf"] {\n        assert!(installer.contains(state_key), "installer state missing {state_key}");\n    }\n}\n'''
          if 'rust_webui_exposes_go_traffic_and_background_trend_contract' not in s:
              s += append
          p.write_text(s)

          Path('.github/workflows/parity-polish-helper.yml').unlink()
          PY
      - name: Validate product changes
        run: |
          chmod +x scripts/install.sh
          bash -n scripts/install.sh
          scripts/install.sh --help >/dev/null
          cargo fmt -- src/api.rs src/main.rs src/web_parity.rs src/server.rs src/client.rs tests/dashboard_script_test.rs
          cargo test --all-targets
          cargo check --release
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(webui): complete traffic and trend parity'
          git push origin HEAD:${{ github.head_ref }}
