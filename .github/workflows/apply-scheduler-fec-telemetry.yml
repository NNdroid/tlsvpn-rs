name: Apply scheduler FEC telemetry fix

on:
  push:
    branches:
      - fix/scheduler-fec-telemetry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduler-fec-telemetry
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply fix
        run: python3 scripts/apply_scheduler_fec_telemetry.py
      - name: Format and focused tests
        run: |
          cargo fmt --all
          cargo test fec_assignment_is_reported_separately_from_data --verbose
          cargo test --test scheduler_fec_telemetry_contract --verbose
      - name: Commit generated fix and remove one-shot files
        run: |
          git rm scripts/apply_scheduler_fec_telemetry.py .github/workflows/apply-scheduler-fec-telemetry.yml
          git add src/adaptive_multipath.rs src/net.rs webui/metrics.js tests/scheduler_fec_telemetry_contract.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(webui): account for FEC parity in scheduler telemetry'
          git push origin HEAD:fix/scheduler-fec-telemetry
