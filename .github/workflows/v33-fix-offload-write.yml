name: v33 fix offload TAP write path

on:
  push:
    branches:
      - perf/linux-tap-offload-v33

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Linux offload TAP wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          tap = Path('src/tap.rs')
          s = tap.read_text()
          s = s.replace(
              'use std::io;\nuse tun_rs::SyncDevice;\n',
              'use std::io;\nuse tun_rs::SyncDevice;\n\n#[cfg(target_os = "linux")]\nuse std::os::fd::AsRawFd;\n',
              1,
          )

          anchor = '\n\n/// In-memory TAP backend used when `--tap mem` is requested (CI/e2e on runners\n'
          wrapper = textwrap.dedent('''\
          
          /// Linux client TAP with virtio-net offload enabled.
          /// IFF_VNET_HDR changes the write contract in both directions: userspace
          /// prepends a virtio_net_hdr even for a normal non-GSO Ethernet frame.
          #[cfg(target_os = "linux")]
          pub struct LinuxOffloadTap {
              inner: SyncDevice,
          }

          #[cfg(target_os = "linux")]
          impl LinuxOffloadTap {
              pub fn new(inner: SyncDevice) -> Self {
                  Self { inner }
              }
          }

          #[cfg(target_os = "linux")]
          impl TapDevice for LinuxOffloadTap {
              fn send(&self, data: &[u8]) -> io::Result<()> {
                  let hdr = [0u8; tun_rs::VIRTIO_NET_HDR_LEN];
                  let iov = [
                      libc::iovec {
                          iov_base: hdr.as_ptr() as *mut libc::c_void,
                          iov_len: hdr.len(),
                      },
                      libc::iovec {
                          iov_base: data.as_ptr() as *mut libc::c_void,
                          iov_len: data.len(),
                      },
                  ];
                  let written = unsafe {
                      libc::writev(
                          self.inner.as_raw_fd(),
                          iov.as_ptr(),
                          iov.len() as libc::c_int,
                      )
                  };
                  if written < 0 {
                      return Err(io::Error::last_os_error());
                  }
                  let expected = hdr.len() + data.len();
                  if written as usize != expected {
                      return Err(io::Error::new(
                          io::ErrorKind::WriteZero,
                          format!("short TAP write: {written}/{expected}"),
                      ));
                  }
                  Ok(())
              }

              fn recv(&self, buf: &mut [u8]) -> io::Result<usize> {
                  let mut original = vec![0u8; tun_rs::VIRTIO_NET_HDR_LEN + 65535];
                  let mut out = [buf];
                  let mut sizes = [0usize; 1];
                  let count = self
                      .inner
                      .recv_multiple(&mut original, &mut out, &mut sizes, 0)?;
                  Ok(if count == 0 { 0 } else { sizes[0] })
              }

              fn recv_batch(
                  &self,
                  original_buffer: &mut [u8],
                  bufs: &mut [Vec<u8>],
                  sizes: &mut [usize],
              ) -> io::Result<usize> {
                  self.inner.recv_multiple(original_buffer, bufs, sizes, 0)
              }
          }
          ''')
          if anchor not in s:
              raise SystemExit('tap wrapper insertion anchor not found')
          tap.write_text(s.replace(anchor, wrapper + anchor, 1))

          client = Path('src/client.rs')
          s = client.read_text()
          old = '''        let dev = builder.build_sync().unwrap();
                  Arc::new(dev)
              };
          '''
          new = '''        let dev = builder.build_sync().unwrap();
                  #[cfg(target_os = "linux")]
                  {
                      Arc::new(crate::tap::LinuxOffloadTap::new(dev))
                  }
                  #[cfg(not(target_os = "linux"))]
                  {
                      Arc::new(dev)
                  }
              };
          '''
          if old not in s:
              raise SystemExit('client device wrapper anchor not found')
          s = s.replace(old, new, 1)
          old_err = '''                Err(_) => {
                              if EXIT.load(Ordering::Relaxed) {
                                  return;
                              }
                              std::thread::sleep(Duration::from_secs(1));
                          }
          '''
          new_err = '''                Err(e) => {
                              if EXIT.load(Ordering::Relaxed) {
                                  return;
                              }
                              warn!("Linux TAP batch read failed: {}", e);
                              std::thread::sleep(Duration::from_secs(1));
                          }
          '''
          if old_err not in s:
              raise SystemExit('client TAP error anchor not found')
          client.write_text(s.replace(old_err, new_err, 1))
          PY

      - name: Check Linux build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v33-fix-offload-write.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs src/tap.rs .github/workflows/v33-fix-offload-write.yml
          git commit -m 'fix: write virtio header on offloaded TAP'
          git push origin HEAD:perf/linux-tap-offload-v33
