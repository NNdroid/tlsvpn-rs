name: Bootstrap Rust ChaCha inner AEAD

on:
  push:
    branches:
      - 'feat/chacha-inner-aead'

permissions:
  contents: write

jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply implementation
        run: |
          python3 scripts/apply_chacha_inner_aead.py
          cargo fmt --all
          cargo test --all --all-targets
          cargo check --release
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_chacha_inner_aead.py .github/workflows/bootstrap-chacha-inner-aead.yml
          git add Cargo.toml Cargo.lock src/main.rs src/crypto.rs src/client.rs src/server.rs
          git commit -m 'feat(crypto): add ChaCha20 and XChaCha20 inner AEAD'
          git push origin HEAD:feat/chacha-inner-aead
