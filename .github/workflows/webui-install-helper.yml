name: WebUI parity implementation helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/webui-install-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch Rust WebUI backend parity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count))

          # ---------- main.rs: accept Go dashboard config fields and expose validator ----------
          rep('src/main.rs', 'pub mod utils;\n', 'pub mod utils;\npub mod web_parity;\n')
          rep('src/main.rs', '''    pub brutal_up: u64,\n    pub brutal_down: u64,\n    pub conns: i32,''', '''    pub brutal_up: u64,\n    pub brutal_down: u64,\n    pub traffic_days: i64,\n    pub traffic_file: String,\n    pub conns: i32,''')
          rep('src/main.rs', '''    brutal: bool,\n    brutal_up: u64,\n    brutal_down: u64,\n    workers: i32,''', '''    brutal: bool,\n    brutal_up: u64,\n    brutal_down: u64,\n    #[serde(default)]\n    traffic_days: i64,\n    #[serde(default)]\n    traffic_file: String,\n    workers: i32,''')
          rep('src/main.rs', '''        brutal_down: if cfg.brutal_down == 0 {\n            500\n        } else {\n            cfg.brutal_down\n        },\n        web: cfg.web.addr,''', '''        brutal_down: if cfg.brutal_down == 0 {\n            500\n        } else {\n            cfg.brutal_down\n        },\n        traffic_days: if cfg.traffic_days == 0 { 30 } else { cfg.traffic_days },\n        traffic_file: if cfg.traffic_file.is_empty() {\n            let p = std::path::Path::new(path);\n            p.parent().unwrap_or_else(|| std::path::Path::new("."))\n                .join("tlsvpn-traffic.json").to_string_lossy().into_owned()\n        } else {\n            cfg.traffic_file\n        },\n        web: cfg.web.addr,''')
          rep('src/main.rs', '''    if args.mode == "client" && args.conns > 65536 {\n        return Err("client.conns must not exceed 65536".into());\n    }''', '''    if args.mode == "client" && args.conns > 65536 {\n        return Err("client.conns must not exceed 65536".into());\n    }\n    if !(1..=3650).contains(&args.traffic_days) {\n        return Err("traffic_days must be between 1 and 3650".into());\n    }''')
          rep('src/main.rs', '''/// 从 argv 提取配置文件路径：`-c path`、`--config path`、`--config=path`。''', '''/// Validate a dashboard-edited JSON document with the exact same loader and\n/// validator used at process startup. The temporary file lives beside the real\n/// config so relative/default path semantics remain identical.\npub(crate) fn validate_config_value(\n    value: &serde_json::Value,\n    source_path: &str,\n) -> Result<Args, String> {\n    let path = std::path::Path::new(source_path);\n    let dir = path.parent().unwrap_or_else(|| std::path::Path::new("."));\n    let tmp = dir.join(format!(\n        ".tlsvpn-web-validate-{}-{}.json",\n        std::process::id(),\n        std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .unwrap_or_default()\n            .as_nanos()\n    ));\n    let mut data = serde_json::to_vec_pretty(value)\n        .map_err(|e| format!("marshal config: {e}"))?;\n    data.push(b'\\n');\n    std::fs::write(&tmp, data).map_err(|e| format!("write validation config: {e}"))?;\n    let result = load_config_file(tmp.to_str().unwrap_or(source_path))\n        .and_then(|args| validate_args(&args).map(|_| args));\n    let _ = std::fs::remove_file(&tmp);\n    result\n}\n\n/// 从 argv 提取配置文件路径：`-c path`、`--config path`、`--config=path`。''')
          # Add Go traffic fields to --print-config template (first matching template occurrence only).
          rep('src/main.rs', '''  "brutal_up": 100,\n  "brutal_down": 500,\n  "socks5": "",''', '''  "brutal_up": 100,\n  "brutal_down": 500,\n  "traffic_days": 30,\n  "traffic_file": "tlsvpn-traffic.json",\n  "socks5": "",''', 1)

          # ---------- api.rs: dynamic dashboard state, cookie sessions, real config/trend/events ----------
          rep('src/api.rs', 'use parking_lot::Mutex;\n', 'use parking_lot::{Mutex, RwLock};\n')
          rep('src/api.rs', 'use tiny_http::{Header, Method, Response, Server as HttpServer};\n', 'use tiny_http::{Header, Method, Response, Server as HttpServer, StatusCode};\n')
          rep('src/api.rs', 'use tracing_subscriber::EnvFilter;\n', 'use tracing_subscriber::EnvFilter;\nuse crate::web_parity::{atomic_write_json, diff_paths, WebParityState};\n')
          rep('src/api.rs', '''#[derive(Debug, Clone, Default)]\npub struct RuntimeCtx {\n    pub cfg: serde_json::Value,\n    pub system: serde_json::Value,\n}''', '''#[derive(Debug)]\npub struct RuntimeCtx {\n    pub cfg: RwLock<serde_json::Value>,\n    pub system: serde_json::Value,\n    pub web: WebParityState,\n}''')
          rep('src/api.rs', '''            "brutal_down": args.brutal_down,\n            "socks5": !args.socks5.is_empty(),''', '''            "brutal_down": args.brutal_down,\n            "traffic_days": args.traffic_days,\n            "traffic_file": args.traffic_file,\n            "socks5": !args.socks5.is_empty(),''')
          rep('src/api.rs', '''        Self {\n            cfg,\n            system: system_info(cfg_path),\n        }''', '''        Self {\n            cfg: RwLock::new(cfg),\n            system: system_info(cfg_path),\n            web: WebParityState::new(cfg_path),\n        }''')

          old_auth = r'''fn check_basic_auth(auth_spec: &str, req: &tiny_http::Request) -> bool {\n    if auth_spec.is_empty() {\n        return true;\n    }\n    let header = req\n        .headers()\n        .iter()\n        .find(|h| h.field.equiv("Authorization"))\n        .map(|h| h.value.as_str().to_string())\n        .unwrap_or_default();\n    let Some(encoded) = header.strip_prefix("Basic ") else {\n        return false;\n    };\n    let Ok(decoded) = Base64::decode_vec(encoded.trim()) else {\n        return false;\n    };\n    let Ok(cred) = String::from_utf8(decoded) else {\n        return false;\n    };\n    ct_eq(&cred, auth_spec)\n}\n'''
          new_auth = r'''fn basic_auth_credential(req: &tiny_http::Request) -> Option<String> {\n    let header = req.headers().iter()\n        .find(|h| h.field.equiv("Authorization"))?\n        .value.as_str();\n    let encoded = header.strip_prefix("Basic ")?;\n    let decoded = Base64::decode_vec(encoded.trim()).ok()?;\n    String::from_utf8(decoded).ok()\n}\n\nfn cookie_value(req: &tiny_http::Request, name: &str) -> String {\n    let Some(raw) = req.headers().iter()\n        .find(|h| h.field.equiv("Cookie"))\n        .map(|h| h.value.as_str()) else { return String::new(); };\n    for part in raw.split(';') {\n        if let Some((k, v)) = part.trim().split_once('=') {\n            if k == name { return v.to_string(); }\n        }\n    }\n    String::new()\n}\n\nfn dashboard_authenticated(ctx: &RuntimeCtx, req: &tiny_http::Request, auth: &str) -> bool {\n    if auth.is_empty() { return true; }\n    let token = cookie_value(req, "tlsvpn_session");\n    if ctx.web.session_valid(&token, auth) { return true; }\n    basic_auth_credential(req).map(|got| ct_eq(&got, auth)).unwrap_or(false)\n}\n\nfn dashboard_cookie(token: &str, secure: bool, clear: bool) -> Header {\n    let mut value = if clear {\n        "tlsvpn_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax".to_string()\n    } else {\n        format!("tlsvpn_session={token}; Path=/; Max-Age=86400; HttpOnly; SameSite=Lax")\n    };\n    if secure { value.push_str("; Secure"); }\n    http_header("Set-Cookie", &value)\n}\n\nfn query_u64(url: &str, name: &str) -> u64 {\n    url.split_once('?').and_then(|(_, q)| {\n        q.split('&').find_map(|kv| {\n            let (k, v) = kv.split_once('=')?;\n            (k == name).then(|| v.parse::<u64>().ok()).flatten()\n        })\n    }).unwrap_or(0)\n}\n'''
          rep('src/api.rs', old_auth, new_auth)

          # Replace old Basic-auth wall with Go-style session/login middleware.
          old_gate = r'''        // 仪表盘页面与 API 一致地受认证保护\n        if !check_basic_auth(&auth, &request) {\n            let resp = Response::from_string("Unauthorized")\n                .with_status_code(401)\n                .with_header(http_header(\n                    "WWW-Authenticate",\n                    r#"Basic realm="tlsvpn dashboard""#,\n                ));\n            let _ = request.respond(resp);\n            continue;\n        }\n'''
          new_gate = r'''        // Browser authentication matches the Go dashboard: web.auth remains the\n        // credential source, but successful login uses an HttpOnly SameSite cookie.\n        // Explicit Basic Auth remains accepted for scripts without emitting a browser\n        // WWW-Authenticate challenge.\n        let expected_auth = ctx.web.current_auth();\n        if !expected_auth.is_empty() {\n            match url.as_str() {\n                "/api/login" => {\n                    if request.method() != &Method::Post {\n                        respond_json(request, json!({"error":"method not allowed"}).to_string(), 405);\n                        continue;\n                    }\n                    const MAX_LOGIN: usize = 8 * 1024;\n                    if request.body_length().map_or(false, |n| n > MAX_LOGIN) {\n                        respond_json(request, json!({"error":"invalid request"}).to_string(), 400);\n                        continue;\n                    }\n                    let mut body = String::new();\n                    if request.as_reader().take((MAX_LOGIN + 1) as u64).read_to_string(&mut body).is_err() || body.len() > MAX_LOGIN {\n                        respond_json(request, json!({"error":"invalid request"}).to_string(), 400);\n                        continue;\n                    }\n                    #[derive(serde::Deserialize)]\n                    #[serde(deny_unknown_fields)]\n                    struct LoginReq { username: String, password: String }\n                    let Ok(login) = serde_json::from_str::<LoginReq>(&body) else {\n                        respond_json(request, json!({"error":"invalid request"}).to_string(), 400);\n                        continue;\n                    };\n                    if !ct_eq(&(login.username + ":" + &login.password), &expected_auth) {\n                        std::thread::sleep(Duration::from_millis(150));\n                        respond_json(request, json!({"error":"invalid username or password"}).to_string(), 401);\n                        continue;\n                    }\n                    match ctx.web.create_session(&expected_auth) {\n                        Ok(token) => {\n                            let resp = Response::from_string(r#"{"status":"ok"}"#)\n                                .with_header(http_header("Content-Type", "application/json"))\n                                .with_header(http_header("Cache-Control", "no-store"))\n                                .with_header(dashboard_cookie(&token, tls, false));\n                            let _ = request.respond(resp);\n                        }\n                        Err(e) => respond_json(request, json!({"error":e}).to_string(), 500),\n                    }\n                    continue;\n                }\n                "/api/logout" => {\n                    if request.method() != &Method::Post {\n                        respond_json(request, json!({"error":"method not allowed"}).to_string(), 405);\n                        continue;\n                    }\n                    ctx.web.revoke_session(&cookie_value(&request, "tlsvpn_session"));\n                    let resp = Response::from_string(r#"{"status":"ok"}"#)\n                        .with_header(http_header("Content-Type", "application/json"))\n                        .with_header(http_header("Cache-Control", "no-store"))\n                        .with_header(dashboard_cookie("", tls, true));\n                    let _ = request.respond(resp);\n                    continue;\n                }\n                "/api/auth/status" => {\n                    let ok = dashboard_authenticated(&ctx, &request, &expected_auth);\n                    respond_json(request, json!({"authenticated":ok}).to_string(), 200);\n                    continue;\n                }\n                _ => {}\n            }\n            let login_asset = matches!(url.as_str(), "/login" | "/login.html" | "/login.css" | "/login.js");\n            if !login_asset && !dashboard_authenticated(&ctx, &request, &expected_auth) {\n                if url.starts_with("/api/") || url == "/metrics" {\n                    respond_json(request, json!({"error":"unauthorized"}).to_string(), 401);\n                } else {\n                    let resp = Response::from_string("")\n                        .with_status_code(303)\n                        .with_header(http_header("Location", "/login"));\n                    let _ = request.respond(resp);\n                }\n                continue;\n            }\n        }\n'''
          rep('src/api.rs', old_gate, new_gate)

          old_stats = r'''                let mut stats = provider.stats_json();\n                if let Some(obj) = stats.as_object_mut() {\n                    obj.insert("cfg".to_string(), ctx.cfg.clone());\n                    obj.insert("system".to_string(), ctx.system.clone());\n                    obj.insert("brutal_system".to_string(), brutal_system_status());\n                }\n                respond_json(request, stats.to_string(), 200);'''
          new_stats = r'''                let mut stats = provider.stats_json();\n                ctx.web.observe_stats(&stats);\n                if let Some(obj) = stats.as_object_mut() {\n                    obj.insert("cfg".to_string(), ctx.cfg.read().clone());\n                    let mut system = ctx.system.clone();\n                    if let Some(sys) = system.as_object_mut() {\n                        sys.insert("needs_restart".to_string(), json!(ctx.web.needs_restart()));\n                    }\n                    obj.insert("system".to_string(), system);\n                    obj.insert("brutal_system".to_string(), brutal_system_status());\n                }\n                respond_json(request, stats.to_string(), 200);'''
          rep('src/api.rs', old_stats, new_stats)

          old_endpoints = r'''            (&Method::Get, "/api/trend") => {\n                respond_json(request, r#"{"step_sec":1,"points":[]}"#.to_string(), 200);\n            }\n            (&Method::Get, "/api/events") => {\n                // EventSource receives JSON and closes; the Go frontend then falls back\n                // to its polling path. Empty is the truthful state until Rust gets an\n                // event ring equivalent to Go events.go.\n                respond_json(request, "[]".to_string(), 200);\n            }\n            (&Method::Get, "/api/config") => {\n                respond_json(request, ctx.cfg.to_string(), 200);\n            }\n            (&Method::Post, "/api/config") => {\n                respond_json(\n                    request,\n                    json!({"error":"runtime config save/apply is not supported by the Rust backend yet"}).to_string(),\n                    501,\n                );\n            }'''
          new_endpoints = r'''            (&Method::Get, "/api/trend") => {\n                respond_json(request, ctx.web.trend_json().to_string(), 200);\n            }\n            (&Method::Get, "/api/events") => {\n                let after = query_u64(request.url(), "after");\n                let polling = request.url().split_once('?').map(|(_, q)|\n                    q.split('&').any(|part| part == "stream=0")\n                ).unwrap_or(false);\n                if polling {\n                    respond_json(request, json!(ctx.web.events.snapshot(after)).to_string(), 200);\n                } else {\n                    let stream = ctx.web.events.stream(after);\n                    let headers = vec![\n                        http_header("Content-Type", "text/event-stream"),\n                        http_header("Cache-Control", "no-cache, no-store"),\n                        http_header("Connection", "keep-alive"),\n                        http_header("X-Accel-Buffering", "no"),\n                    ];\n                    std::thread::spawn(move || {\n                        let response = Response::new(StatusCode(200), headers, stream, None, None);\n                        let _ = request.respond(response);\n                    });\n                }\n            }\n            (&Method::Get, "/api/config") => {\n                let body = serde_json::to_string_pretty(&ctx.web.redacted_config())\n                    .unwrap_or_else(|_| "{}".to_string());\n                respond_json(request, body, 200);\n            }\n            (&Method::Post, "/api/config") => {\n                const MAX_CONFIG_BODY: usize = 1024 * 1024;\n                let mut content = String::new();\n                if request.as_reader().take((MAX_CONFIG_BODY + 1) as u64).read_to_string(&mut content).is_err() || content.len() > MAX_CONFIG_BODY {\n                    respond_json(request, json!({"error":"invalid config body"}).to_string(), 400);\n                    continue;\n                }\n                let Ok(value) = serde_json::from_str::<serde_json::Value>(&content) else {\n                    respond_json(request, json!({"error":"bad json"}).to_string(), 400);\n                    continue;\n                };\n                let merged = ctx.web.merge_preserving_secrets(value);\n                match crate::validate_config_value(&merged, ctx.web.config_path().to_string_lossy().as_ref()) {\n                    Ok(_) => match atomic_write_json(ctx.web.config_path(), &merged) {\n                        Ok(()) => { ctx.web.replace_config(merged); respond_json(request, r#"{"status":"ok"}"#.to_string(), 200); }\n                        Err(e) => respond_json(request, json!({"error":e}).to_string(), 400),\n                    },\n                    Err(e) => respond_json(request, json!({"error":e}).to_string(), 400),\n                }\n            }'''
          rep('src/api.rs', old_endpoints, new_endpoints)

          rep('src/api.rs', '''                    #[serde(default)]\n                    ttl_minutes: i64,\n                }''', '''                    #[serde(default)]\n                    ttl_minutes: i64,\n                    #[serde(default)]\n                    config: Option<serde_json::Value>,\n                }''')

          old_dispatch = r'''                match provider.control(&creq.action, &creq.client_id, &creq.level, creq.ttl_minutes)\n                {\n                    Ok(()) => respond_json(request, r#"{"status": "ok"}"#.to_string(), 200),\n                    Err(e) => respond_json(request, json!({"error": e}).to_string(), 400),\n                }'''
          new_dispatch = r'''                if creq.action == "save" || creq.action == "save_apply" {\n                    let Some(candidate) = creq.config else {\n                        respond_json(request, json!({"error":"config is required"}).to_string(), 400);\n                        continue;\n                    };\n                    let apply = creq.action == "save_apply";\n                    let old = ctx.web.current_config();\n                    let merged = ctx.web.merge_preserving_secrets(candidate);\n                    let validated = match crate::validate_config_value(&merged, ctx.web.config_path().to_string_lossy().as_ref()) {\n                        Ok(v) => v,\n                        Err(e) => { respond_json(request, json!({"error":e}).to_string(), 400); continue; }\n                    };\n                    if let Err(e) = atomic_write_json(ctx.web.config_path(), &merged) {\n                        respond_json(request, json!({"error":e}).to_string(), 400);\n                        continue;\n                    }\n                    let changed = diff_paths(&old, &merged);\n                    let mut needs_restart = Vec::new();\n                    if apply {\n                        for field in &changed {\n                            match field.as_str() {\n                                "log_level" => { let _ = provider.control("loglevel", "", &validated.loglevel, 0); }\n                                "pad_mode" => { let _ = provider.control("pad_mode", "", &validated.pad_mode, 0); }\n                                _ => needs_restart.push(field.clone()),\n                            }\n                        }\n                        if let Some(cfg) = ctx.cfg.write().as_object_mut() {\n                            cfg.insert("log_level".into(), json!(validated.loglevel));\n                            cfg.insert("pad_mode".into(), json!(crate::crypto::pad_mode_name()));\n                            cfg.insert("traffic_days".into(), json!(validated.traffic_days));\n                            cfg.insert("traffic_file".into(), json!(validated.traffic_file));\n                        }\n                    }\n                    ctx.web.replace_config(merged);\n                    ctx.web.set_needs_restart(needs_restart.clone());\n                    ctx.web.events.emit("config", "info", "", &format!("{} (needs_restart: {:?})", creq.action, needs_restart));\n                    respond_json(request, json!({"status":"ok","needs_restart":needs_restart}).to_string(), 200);\n                    continue;\n                }\n                match provider.control(&creq.action, &creq.client_id, &creq.level, creq.ttl_minutes) {\n                    Ok(()) => {\n                        ctx.web.events.emit("control", "info", &creq.client_id, &creq.action);\n                        respond_json(request, r#"{"status": "ok"}"#.to_string(), 200)\n                    }\n                    Err(e) => respond_json(request, json!({"error": e}).to_string(), 400),\n                }'''
          rep('src/api.rs', old_dispatch, new_dispatch)

          # README: replace old parity-limit paragraph and add installer section before Notes.
          p=Path('README.md'); s=p.read_text()
          old='''Current backend parity limits are explicit: `/api/trend` returns an empty compatibility series, `/api/events` returns an empty compatibility list rather than Go's event stream, and `POST /api/config` returns HTTP 501 because runtime config persistence/hot-apply is not implemented in Rust yet. `GET /api/config` is available for display. The shared frontend therefore looks aligned with Go, but those three backend capabilities are not yet equivalent.\n'''
          if old not in s: raise SystemExit('README old WebUI parity paragraph missing')
          s=s.replace(old, '''The dashboard backend follows the Go contract as well: browser login uses the same HttpOnly session-cookie flow (Basic Auth remains available to scripts), `/api/trend` keeps a live 1-second ring, `/api/events` provides SSE plus polling recovery, and the settings editor reads/writes the source JSON with PSK/Web-auth/SOCKS credentials redacted and preserved. `save_apply` hot-applies log level and padding immediately and reports every other changed path in `needs_restart`. Rust accepts Go's `traffic_days`/`traffic_file` configuration keys in addition to its `workers`/`mtu` extensions.\n''')
          marker='''## Notes\n'''
          installer='''## One-click installer\n\n`scripts/install.sh` is an English-only interactive/CLI installer for Debian, Ubuntu, Rocky/RHEL-family and Alpine Linux. It supports `install`, `upgrade`, `uninstall`, `rollback`, `maintenance` and `status`, keeps rollback snapshots of TLSVPN-managed files, installs systemd or OpenRC services, and can create a daily maintenance timer. Run it without an action for the wizard; type `back` at wizard prompts to move to the previous step.\n\n```bash\n# Interactive\nsudo bash scripts/install.sh\n\n# ACME/lego with a normal DNS name\nsudo bash scripts/install.sh install --mode server --psk 'REPLACE-ME' \\\n  --cert-mode lego --cert-name vpn.example.com --email admin@example.com\n\n# ACME/lego with a public IP identifier (RFC 8738 / short-lived profile)\nsudo bash scripts/install.sh install --mode server --psk 'REPLACE-ME' \\\n  --cert-mode lego --cert-name 203.0.113.10 --email admin@example.com\n\n# Client plus optional tuning/components\nsudo bash scripts/install.sh install --mode client --server vpn.example.com:4000 \\\n  --psk 'REPLACE-ME' --tcp-brutal yes --optimize-kernel yes\n\nsudo bash scripts/install.sh upgrade\nsudo bash scripts/install.sh rollback\nsudo bash scripts/install.sh uninstall --purge\n```\n\nCertificates can use lego/ACME, self-signed, or an existing cert/key pair. Daily maintenance renews lego certificates and checks GitHub Releases for a newer TLSVPN binary. XanMod is intentionally automated only on Debian/Ubuntu x86_64; tcp-brutal is optional and skipped on Alpine, and the installer warns about known-risk newer XanMod combinations unless `--force-tcp-brutal` is explicitly supplied. XanMod packages are never automatically removed on uninstall because removing a running kernel is unsafe.\n\n'''
          if marker not in s: raise SystemExit('README Notes marker missing')
          p.write_text(s.replace(marker, installer+marker, 1))

          # Tests lock the new API/installer contract.
          p=Path('tests/dashboard_script_test.rs'); s=p.read_text()
          s += r'''\n#[test]\nfn rust_webui_backend_matches_go_management_contract() {\n    let api = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/api.rs")).expect("api.rs");\n    let parity = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/web_parity.rs")).expect("web_parity.rs");\n    for marker in [\n        "tlsvpn_session", "/api/login", "/api/logout", "/api/auth/status",\n        "text/event-stream", "save_apply", "needs_restart", "redacted_config",\n    ] {\n        assert!(api.contains(marker) || parity.contains(marker), "missing WebUI backend contract marker {marker}");\n    }\n    assert!(!api.contains("runtime config save/apply is not supported"));\n}\n\n#[test]\nfn installer_has_required_lifecycle_and_platform_contract() {\n    let installer = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("scripts/install.sh")).expect("install.sh");\n    for marker in [\n        "install_action", "upgrade_action", "uninstall_action", "rollback_action",\n        "maintenance_action", "debian|ubuntu", "rocky", "alpine",\n        "cert-mode", "lego", "self-signed", "XanMod", "tcp-brutal",\n        "tlsvpn-maintenance.timer", "--non-interactive", "back",\n    ] {\n        assert!(installer.contains(marker), "installer missing {marker}");\n    }\n}\n'''
          p.write_text(s)

          # Helper is intentionally self-deleting; final PR must contain product changes only.
          Path('.github/workflows/webui-install-helper.yml').unlink()
          PY
      - name: Format and validate
        run: |
          chmod +x scripts/install.sh
          bash -n scripts/install.sh
          scripts/install.sh --help >/dev/null
          cargo fmt --all -- --check || cargo fmt --all
          cargo test --all-targets
          cargo check --release
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/api.rs src/web_parity.rs scripts/install.sh README.md tests/dashboard_script_test.rs .github/workflows/webui-install-helper.yml
          git commit -m 'feat: align Rust WebUI and add one-click installer'
