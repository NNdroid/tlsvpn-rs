name: One-shot exact stats parity

on:
  push:
    branches:
      - parity/go-main-20261001
    paths:
      - .github/workflows/parity-stats-exact-temp.yml
      - scripts/parity_stats_exact_temp.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/go-main-20261001
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact stats parity
        run: |
          python3 scripts/parity_stats_exact_temp.py
          cargo test --verbose
      - name: Commit and self-clean
        run: |
          rm -f scripts/parity_stats_exact_temp.py .github/workflows/parity-stats-exact-temp.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'stats: match Go FEC lifetime and active-state semantics'
          git push origin HEAD:parity/go-main-20261001
