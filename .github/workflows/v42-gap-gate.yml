name: v42 gate timeout delivery on active gaps

on:
  push:
    branches:
      - perf/client-tap-delivery-v42

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate timeout batch-pool access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client.rs')
          s = p.read_text()
          old = '''        if let Some(wait) = cl.reorder_buf.lock().next_timeout() {
              poll_timeout = poll_timeout.min(wait);
          }
          '''
          new = '''        let reorder_wait = cl.reorder_buf.lock().next_timeout();
          if let Some(wait) = reorder_wait {
              poll_timeout = poll_timeout.min(wait);
          }
          '''
          if old not in s:
              raise SystemExit('reorder deadline anchor not found')
          s = s.replace(old, new, 1)
          old = '''        // A gap timeout can release a burst. Queue it while still holding the
          // reorder lock so multiple physical connections cannot enqueue ready batches
          // out of sequence; the TAP syscall itself runs on the delivery worker.
          flush_reorder_to_tap(&cl);
          '''
          new = '''        // Only touch the delivery batch pool while a reorder gap exists. This
          // keeps the normal no-gap / upload hot path identical to main.
          if reorder_wait.is_some() {
              flush_reorder_to_tap(&cl);
          }
          '''
          if old not in s:
              raise SystemExit('gap delivery anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Check Linux build
        run: cargo check --all-targets
      - name: Run tests
        run: cargo test --all-targets
      - name: Commit and remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/v42-gap-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs .github/workflows/v42-gap-gate.yml
          git commit -m 'perf(client): gate async timeout delivery on reorder gaps'
          git push origin HEAD:perf/client-tap-delivery-v42
