name: Bootstrap peer metadata review fixes

on:
  push:
    branches: ["feat/peer-info-handshake"]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/peer-info-handshake
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/api.rs')
          s = p.read_text()
          old = "    ['对端',peerLine||'-'],"
          new = "    ['对端',peerLine?esc(peerLine):'-'],"
          if s.count(old) != 1:
              raise SystemExit(f'expected one unescaped peer line, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

          cat > build.rs <<'EOF'
          use std::fs;
          use std::process::Command;

          fn git(args: &[&str]) -> Option<String> {
              let out = Command::new("git").args(args).output().ok()?;
              if !out.status.success() {
                  return None;
              }
              let value = String::from_utf8(out.stdout).ok()?.trim().to_string();
              (!value.is_empty()).then_some(value)
          }

          fn watch_git_revision() {
              let Some(head_path) = git(&["rev-parse", "--git-path", "HEAD"]) else {
                  return;
              };
              println!("cargo:rerun-if-changed={head_path}");

              if let Ok(head) = fs::read_to_string(&head_path) {
                  if let Some(reference) = head.trim().strip_prefix("ref: ") {
                      if let Some(reference_path) = git(&["rev-parse", "--git-path", reference]) {
                          println!("cargo:rerun-if-changed={reference_path}");
                      }
                  }
              }

              if let Some(packed_refs) = git(&["rev-parse", "--git-path", "packed-refs"]) {
                  println!("cargo:rerun-if-changed={packed_refs}");
              }
          }

          fn main() {
              println!("cargo:rerun-if-env-changed=TLSVPN_GIT_COMMIT");
              println!("cargo:rerun-if-env-changed=TLSVPN_BUILD_TIME");
              watch_git_revision();

              let commit = std::env::var("TLSVPN_GIT_COMMIT")
                  .ok()
                  .filter(|v| !v.trim().is_empty())
                  .or_else(|| git(&["rev-parse", "HEAD"]));
              if let Some(value) = commit {
                  println!("cargo:rustc-env=TLSVPN_GIT_COMMIT={value}");
              }

              // Keep builds reproducible: this is the VCS commit timestamp unless the
              // build environment explicitly supplies TLSVPN_BUILD_TIME. We do not use
              // wall-clock `now` here.
              let build_time = std::env::var("TLSVPN_BUILD_TIME")
                  .ok()
                  .filter(|v| !v.trim().is_empty())
                  .or_else(|| git(&["show", "-s", "--format=%cI", "HEAD"]));
              if let Some(value) = build_time {
                  println!("cargo:rustc-env=TLSVPN_BUILD_TIME={value}");
              }
          }
          EOF

          cargo fmt --all -- --check
          grep -F "['对端',peerLine?esc(peerLine):'-']" src/api.rs

      - name: Test
        run: cargo test --all --all-targets

      - name: Commit fixes and remove bootstrap workflow
        run: |
          git config user.name NNdroid
          git config user.email 99177648+NNdroid@users.noreply.github.com
          git rm .github/workflows/bootstrap-peer-review-fix.yml
          git add src/api.rs build.rs
          git commit -m "fix(webui): escape peer metadata and refresh build VCS info"
          git push origin HEAD:feat/peer-info-handshake
