name: v42 narrow gap gate

on:
  push:
    branches:
      - perf/client-tap-delivery-v42

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate timeout pool access with narrow anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/client.rs')
          s = p.read_text()
          old = "        if let Some(wait) = cl.reorder_buf.lock().next_timeout() {\n"
          new = "        let reorder_wait = cl.reorder_buf.lock().next_timeout();\n        if let Some(wait) = reorder_wait {\n"
          if old not in s:
              raise SystemExit('deadline statement not found')
          s = s.replace(old, new, 1)
          old = "        flush_reorder_to_tap(&cl);\n"
          new = "        if reorder_wait.is_some() {\n            flush_reorder_to_tap(&cl);\n        }\n"
          if old not in s:
              raise SystemExit('flush statement not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Check Linux build
        run: cargo check --all-targets
      - name: Run tests
        run: cargo test --all-targets
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/v42-gap-gate.yml .github/workflows/v42-gap-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs .github/workflows/v42-gap-gate.yml .github/workflows/v42-gap-fix.yml
          git commit -m 'perf(client): skip TAP delivery pool without reorder gaps'
          git push origin HEAD:perf/client-tap-delivery-v42
