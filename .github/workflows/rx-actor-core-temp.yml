name: One-shot RX actor core

on:
  push:
    branches:
      - perf/rx-session-actor
    paths:
      - .github/workflows/rx-actor-core-temp.yml
      - scripts/rx_actor_core_temp.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actor branch
        uses: actions/checkout@v4
        with:
          ref: perf/rx-session-actor
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply actor core
        run: |
          python3 scripts/rx_actor_core_temp.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/protocol.rs')
          s = p.read_text()
          old = '''        let generation = self.generation.get_mut();
                  if control.generation <= *generation {
                      return false;
                  }
                  let (from, _) = self.window();
                  *generation = control.generation;
          '''
          new = '''        let (from, _) = self.window();
                  let generation = self.generation.get_mut();
                  if control.generation <= *generation {
                      return false;
                  }
                  *generation = control.generation;
          '''
          if old not in s:
              raise SystemExit('protocol apply_actor borrow marker not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/fec.rs')
          s = p.read_text()
          old = '''        let k_self = self.k;
                  let inner = self.inner.get_mut();
                  let retired = self.retired_before.load(Ordering::Acquire);
          '''
          new = '''        let k_self = self.k;
                  let retired = self.retired_before.load(Ordering::Acquire);
                  let inner = self.inner.get_mut();
          '''
          if old not in s:
              raise SystemExit('fec actor parity borrow marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rustfmt --edition 2021 --config skip_children=true src/main.rs src/protocol.rs src/fec.rs src/rx_actor.rs
          cargo test rx_actor --verbose
          cargo test fec --verbose
          cargo test protocol --verbose
          cargo test --verbose
      - name: Commit validated actor core and self-clean
        run: |
          rm -f scripts/rx_actor_core_temp.py .github/workflows/rx-actor-core-temp.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'perf: add session-owned RX actor core'
          git push origin HEAD:perf/rx-session-actor
