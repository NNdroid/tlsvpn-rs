name: Apply FEC lock fastpath experiment

on:
  push:
    branches:
      - perf/fec-lock-fastpath-v31

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/fec-lock-fastpath-v31
      - name: Apply focused AsyncPort FEC fastpath patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/net.rs')
          s = p.read_text()

          replacements = [
              (
                  '    encoder: Mutex<Option<FecEncoder>>,\n    dropped: AtomicU64,',
                  '    encoder: Mutex<Option<FecEncoder>>,\n    // FEC 关闭是主流热路径；原子门让每个数据帧无需进入 encoder mutex。\n    // 启用时仍走原有锁，保持 encoder 状态串行化。\n    fec_enabled: AtomicBool,\n    dropped: AtomicU64,',
              ),
              (
                  '            encoder: Mutex::new(None),\n            dropped: AtomicU64::new(0),',
                  '            encoder: Mutex::new(None),\n            fec_enabled: AtomicBool::new(false),\n            dropped: AtomicU64::new(0),',
              ),
              (
                  '    pub fn attach_encoder(&self, k: usize, ic: Option<Arc<InnerCipher>>) {\n        *self.encoder.lock() = Some(FecEncoder::new(k, ic));\n    }',
                  '    pub fn attach_encoder(&self, k: usize, ic: Option<Arc<InnerCipher>>) {\n        *self.encoder.lock() = Some(FecEncoder::new(k, ic));\n        // 先发布完整 encoder，再打开热路径门。\n        self.fec_enabled.store(true, Ordering::Release);\n    }',
              ),
              (
                  '        *self.encoder.lock() = if k >= crate::fec::FEC_MIN_GROUP {\n            Some(FecEncoder::new(k, ic))\n        } else {\n            None\n        };',
                  '        let fec_enabled = k >= crate::fec::FEC_MIN_GROUP;\n        *self.encoder.lock() = if fec_enabled {\n            Some(FecEncoder::new(k, ic))\n        } else {\n            None\n        };\n        // Release 与发送热路径的 Acquire 配对；启用时确保先看到 encoder，\n        // 关闭时即使竞态读到旧 true，也只会多拿一次锁并得到 None。\n        self.fec_enabled.store(fec_enabled, Ordering::Release);',
              ),
              (
                  '        let parity = self\n            .encoder\n            .lock()\n            .as_mut()\n            .and_then(|enc| enc.add(seq, frame.as_slice()));',
                  '        let parity = if self.fec_enabled.load(Ordering::Acquire) {\n            self.encoder\n                .lock()\n                .as_mut()\n                .and_then(|enc| enc.add(seq, frame.as_slice()))\n        } else {\n            None\n        };',
              ),
          ]

          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one match, found {n}: {old[:80]!r}')
              s = s.replace(old, new)

          anchor = '''    #[test]\n    fn saturated_backends_do_not_consume_sequence() {'''
          test = '''    #[test]\n    fn fec_fast_path_tracks_epoch_enablement() {\n        let port = AsyncPort::new("fec-fastpath".into());\n        assert!(!port.fec_enabled.load(Ordering::Acquire));\n\n        port.reset_epoch(crate::fec::FEC_MIN_GROUP, None);\n        assert!(port.fec_enabled.load(Ordering::Acquire));\n        assert!(port.encoder.lock().is_some());\n\n        port.reset_epoch(0, None);\n        assert!(!port.fec_enabled.load(Ordering::Acquire));\n        assert!(port.encoder.lock().is_none());\n\n        port.attach_encoder(crate::fec::FEC_MIN_GROUP, None);\n        assert!(port.fec_enabled.load(Ordering::Acquire));\n        assert!(port.encoder.lock().is_some());\n    }\n\n    #[test]\n    fn saturated_backends_do_not_consume_sequence() {'''
          n = s.count(anchor)
          if n != 1:
              raise SystemExit(f'expected test anchor once, found {n}')
          s = s.replace(anchor, test)

          p.write_text(s)
          PY
          git diff --check
          cargo test --quiet fec_fast_path_tracks_epoch_enablement
          cargo test --quiet fec_parity_is_suppressed_until_second_path_exists
          cargo test --quiet fec_parity_is_sent_once_across_multiple_backends
      - name: Commit experiment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/net.rs
          git commit -m 'perf: skip FEC encoder lock when disabled'
          git push origin HEAD:perf/fec-lock-fastpath-v31
