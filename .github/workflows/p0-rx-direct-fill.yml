name: P0 RX direct-fill optimization

on:
  push:
    branches:
      - perf/rx-zero-copy-slab

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/rx-zero-copy-slab
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply direct-fill FrameScanner patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/frame.rs')
          s = path.read_text()

          old = '''pub struct FrameScanner {
    buffer: Vec<u8>,
    lazy_compact: bool,
    offset: usize,
    // 当前允许的帧负载上限：认证前的握手帧用小上限，认证通过后恢复线路
'''
          new = '''pub struct FrameScanner {
    buffer: Vec<u8>,
    lazy_compact: bool,
    offset: usize,
