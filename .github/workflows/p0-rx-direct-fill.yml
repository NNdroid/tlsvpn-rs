name: P0 RX direct-fill optimization

on:
  push:
    branches:
      - perf/rx-zero-copy-slab

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/rx-zero-copy-slab
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply direct-fill FrameScanner patch
        run: |
          python3 scripts/p0_rx_direct_patch.py
          python3 scripts/p0_rx_direct_fix.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Test core logic
        run: cargo test --all-targets

      - name: Release protocol benchmark smoke
        run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_protocol_throughput -- --ignored --nocapture

      - name: RX benchmark smoke
        run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_rx_direct_batch -- --ignored --nocapture

      - name: Commit tested implementation
        shell: bash
        run: |
          rm -f .github/workflows/p0-rx-direct-fill.yml scripts/p0_rx_direct_patch.py scripts/p0_rx_direct_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frame.rs scripts/dataplane_candidates.sh docs/rx-dataplane-performance.md .github/workflows/p0-rx-direct-fill.yml scripts/p0_rx_direct_patch.py scripts/p0_rx_direct_fix.py
          git commit -m 'perf: direct-fill RX frames from rustls plaintext'
          git push origin HEAD:perf/rx-zero-copy-slab
