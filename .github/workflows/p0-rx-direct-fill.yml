          assert old in s
          s = s.replace(old, new, 1)

          old = '''        Self {
            buffer: Vec::with_capacity(HANDSHAKE_DATA_LENGTH),
            lazy_compact: std::env::var("TLSVPN_RX_COMPACT").as_deref() == Ok("1"),
            offset: 0,
            max_data_len: MAX_DATA_LENGTH,
