          assert old in s
          s = s.replace(old, new, 1)

          # The first test intentionally exercises legacy compaction internals.
          old = '''        let mut scanner = FrameScanner::new();
        scanner.lazy_compact = true;
        scanner.buffer.extend_from_slice(&stream[..HANDSHAKE_DATA_LENGTH]);
'''
          new = '''        let mut scanner = FrameScanner::new();
        scanner.direct_fill = false;
        scanner.lazy_compact = true;
        scanner.buffer.extend_from_slice(&stream[..HANDSHAKE_DATA_LENGTH]);
'''
          assert old in s
          s = s.replace(old, new, 1)

          # The legacy fragmented/compaction matrix remains an explicit fallback test.
          old = '''            let mut scanner = FrameScanner::new();
            scanner.lazy_compact = enabled;
            let mut reader = Fragmented(std::io::Cursor::new(stream.clone()));
'''
          new = '''            let mut scanner = FrameScanner::new();
            scanner.direct_fill = false;
            scanner.lazy_compact = enabled;
            let mut reader = Fragmented(std::io::Cursor::new(stream.clone()));
'''
          assert old in s
          s = s.replace(old, new, 1)

          insert_before = '''    /// 填充必须按线路长度（明文 + GCM 标签）分桶，而不是明文长度。
'''
          assert insert_before in s
          test = r'''    #[test]
    fn direct_fill_handles_fragmented_payload_padding_and_would_block() {
        struct Fragmented {
            inner: std::io::Cursor<Vec<u8>>,
            block_next: bool,
        }
        impl Read for Fragmented {
            fn read(&mut self, out: &mut [u8]) -> io::Result<usize> {
                if self.block_next {
                    self.block_next = false;
                    return Err(ErrorKind::WouldBlock.into());
                }
                let want = out.len().min(137);
                let n = self.inner.read(&mut out[..want])?;
                self.block_next = n != 0;
                Ok(n)
            }
        }

        let mut stream = Vec::new();
        append_frame_head(&mut stream, 1500, 23, 41);
        stream.extend_from_slice(&vec![0x5a; 1500]);
        stream.extend_from_slice(&vec![0xa5; 23]);
        append_frame_head(&mut stream, 9000, 7, 42);
        stream.extend_from_slice(&vec![0x6b; 9000]);
        stream.extend_from_slice(&vec![0xb6; 7]);

        let mut scanner = FrameScanner::new();
        scanner.direct_fill = true;
        let mut reader = Fragmented {
            inner: std::io::Cursor::new(stream),
            block_next: false,
        };

        for (want_seq, want_len, want_byte) in [(41, 1500, 0x5a), (42, 9000, 0x6b)] {
            let frame = loop {
                match scanner.read_frame(&mut reader).unwrap() {
                    Some(frame) => break frame,
                    None => continue,
                }
            };
            assert_eq!(frame.1, want_seq);
            assert_eq!(frame.0.len(), want_len);
            assert!(frame.0.iter().all(|b| *b == want_byte));
            release_frame_vec(frame.0);
        }
    }

    #[test]
    fn direct_fill_rejects_oversized_frame_before_allocating_payload() {
        let mut stream = Vec::new();
        append_frame_head(&mut stream, MAX_DATA_LENGTH as u32 + 1, 0, 9);
        let mut scanner = FrameScanner::new();
        scanner.direct_fill = true;
        let err = scanner
            .read_frame(&mut std::io::Cursor::new(stream))
            .unwrap_err();
        assert_eq!(err.kind(), ErrorKind::InvalidData);
        assert!(scanner.direct_data.is_none());
        assert_eq!(scanner.direct_header_read, 0);
    }

'''
          s = s.replace(insert_before, test + insert_before, 1)
          path.write_text(s)

          # Add the candidate to the existing real-TAP A/B harness.
          path = Path('scripts/dataplane_candidates.sh')
          s = path.read_text()
          s = s.replace(
              'env TLSVPN_RX_OWNED=0 TLSVPN_TX_BATCH=0 TLSVPN_RX_COMPACT=0 TLSVPN_SWITCH_BATCH=0 \\\n',
              'env TLSVPN_RX_OWNED=0 TLSVPN_TX_BATCH=0 TLSVPN_RX_COMPACT=0 TLSVPN_RX_DIRECT=0 TLSVPN_SWITCH_BATCH=0 \\\n',
              1,
          )
          s = s.replace(
              'for flag in TLSVPN_RX_OWNED TLSVPN_TX_BATCH TLSVPN_RX_COMPACT TLSVPN_SWITCH_BATCH; do',
              'for flag in TLSVPN_RX_OWNED TLSVPN_TX_BATCH TLSVPN_RX_COMPACT TLSVPN_RX_DIRECT TLSVPN_SWITCH_BATCH; do',
              1,
          )
          s = s.replace(
              '      "TLSVPN_RX_COMPACT=$enabled" "TLSVPN_SWITCH_BATCH=$enabled"',
              '      "TLSVPN_RX_COMPACT=$enabled" "TLSVPN_RX_DIRECT=$enabled" "TLSVPN_SWITCH_BATCH=$enabled"',
              1,
          )
          path.write_text(s)

          # Document the default-on direct-fill path and the negative control.
          path = Path('docs/rx-dataplane-performance.md')
          s = path.read_text()
          needle = '''* `TLSVPN_RX_COMPACT=1`: scanner tail compaction is deferred until storage is
  full or consumed. It reduces tail copies, not the payload extraction copy;
  this is not a zero-copy TLS decoder. Padding, length caps and fragmented reads
  retain their original behavior.
'''
          replacement = '''* `TLSVPN_RX_DIRECT=1` (default): after the fixed 10-byte TLSVPN header is
  parsed, rustls plaintext is read directly into the final pooled frame buffer.
  This removes the old scanner-buffer -> frame-buffer payload memcpy. Padding is
  drained through a fixed scratch buffer and fragmented/WouldBlock reads preserve
  parser state. Set `TLSVPN_RX_DIRECT=0` for the old buffered extractor.
* `TLSVPN_RX_COMPACT=1`: controls tail compaction only when the legacy buffered
  extractor is selected with `TLSVPN_RX_DIRECT=0`.
'''
          assert needle in s
          path.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Format and validate patch
        run: |
          cargo fmt -- --check
          git diff --check

      - name: Test core logic
        run: cargo test --all-targets

      - name: Release protocol benchmark smoke
        run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_protocol_throughput -- --ignored --nocapture

      - name: RX benchmark smoke
        run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_rx_direct_batch -- --ignored --nocapture

      - name: Commit tested implementation
        shell: bash
        run: |
          rm -f .github/workflows/p0-rx-direct-fill.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/frame.rs scripts/dataplane_candidates.sh docs/rx-dataplane-performance.md .github/workflows/p0-rx-direct-fill.yml
          git commit -m 'perf: direct-fill RX frames from rustls plaintext'
          git push origin HEAD:perf/rx-zero-copy-slab
