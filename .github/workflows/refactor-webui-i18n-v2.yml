name: WebUI i18n codemod v2
on:
  push:
    branches:
      - refactor/webui-i18n-20260929
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate refactor
        run: python3 scripts/refactor_webui_i18n.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-webui-i18n.yml .github/workflows/refactor-webui-i18n-v2.yml scripts/refactor_webui_i18n.py
          git add -A
          git commit -m "refactor(webui): centralize i18n"
          git push origin HEAD:${GITHUB_REF_NAME}
