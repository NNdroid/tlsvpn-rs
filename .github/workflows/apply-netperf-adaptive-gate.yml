name: Apply adaptive multipath Real-TAP gate

on:
  push:
    branches:
      - perf/adaptive-multipath-scheduler-20260929
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply Real-TAP multipath gate
        run: python3 scripts/apply_netperf_adaptive_gate.py

      - name: Validate shell and contract
        run: |
          bash -n scripts/net_perf_test.sh
          cargo test --test netperf_adaptive_contract --verbose

      - name: Commit clean gate result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply_netperf_adaptive_gate.py .github/workflows/apply-netperf-adaptive-gate.yml
          git add -A -- scripts/apply_netperf_adaptive_gate.py .github/workflows/apply-netperf-adaptive-gate.yml
          git add scripts/net_perf_test.sh .github/workflows/rust.yml tests/netperf_adaptive_contract.rs
          git commit -m 'test: enforce adaptive multipath path utilization in Real-TAP CI'
          git push
