name: v43 one-shot inline ACK delivery

on:
  push:
    branches:
      - perf/client-inline-ack-v43

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch tiny-frame inline delivery fast path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path('src/client.rs')
          s = p.read_text()

          old_import = 'use std::sync::atomic::{AtomicBool, AtomicI32, AtomicI64, AtomicU32, AtomicU64, Ordering};'
          new_import = 'use std::sync::atomic::{AtomicBool, AtomicI32, AtomicI64, AtomicU32, AtomicU64, AtomicUsize, Ordering};'
          if old_import not in s:
              raise SystemExit('atomic import anchor not found')
          s = s.replace(old_import, new_import, 1)

          start = s.index('// Match the Go receive architecture: reorder extraction must not block the TLS')
          end = s.index('\npub struct Client {', start)
          new_block = base64.b64decode('').decode()
          s = s[:start] + new_block + s[end:]

          count = s.count('cl.tap_delivery.enqueue(ready);')
          if count != 2:
              raise SystemExit(f'expected 2 enqueue call sites, found {count}')
          s = s.replace('cl.tap_delivery.enqueue(ready);', 'cl.tap_delivery.deliver(ready);')

          old_tests = '    use super::{clamp_poll_for_tx_backlog, client_socket_interest};\n'
          new_tests = '    use super::{clamp_poll_for_tx_backlog, client_socket_interest, tap_delivery_can_inline};\n    use std::sync::Arc;\n'
          if old_tests not in s:
              raise SystemExit('test import anchor not found')
          s = s.replace(old_tests, new_tests, 1)

          test_anchor = '    #[test]\n    fn writable_interest_is_only_enabled_for_real_backpressure() {\n'
          test_block = base64.b64decode('').decode()
          if test_anchor not in s:
              raise SystemExit('test insertion anchor not found')
          s = s.replace(test_anchor, test_block + test_anchor, 1)

          p.write_text(s)
          PY

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit experiment and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v43-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs .github/workflows/v43-one-shot.yml
          git commit -m 'perf(client): inline idle tiny TAP deliveries'
          git push origin HEAD:perf/client-inline-ack-v43
