name: Rust Tests and Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --verbose

    - name: Test Core Logic
      run: cargo test --verbose

    - name: Check Linux ARM64 dataplane
      # The primary deployment class includes ARM64 SBCs. This compile check
      # exercises the AArch64 NEON FEC path which native x86 CI cannot see.
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      run: |
        rustup target add aarch64-unknown-linux-gnu
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          gcc-aarch64-linux-gnu libc6-dev-arm64-cross
        # ring compiles C/asm during the target build; the cross compiler alone
        # is insufficient without the target libc headers (stdint.h -> bits/*).
        cargo check --target aarch64-unknown-linux-gnu --verbose

    - name: Verify protocol golden vectors (cross-language contract)
      env:
        TLSVPN_GOLDEN: "testdata/protocol_golden.json"
      run: |
        # Fetch the shared golden vector generated by the Go implementation.
        curl -fsSL -o testdata/protocol_golden.json \
          "https://raw.githubusercontent.com/NNdroid/tlsvpn/main/testdata/protocol_golden.json" \
          || echo "golden vector fetch failed — running without cross-check"
        cargo test --verbose --test protocol_conformance

    - name: Benchmark Protocol
      # bench_protocol_throughput is #[ignore]d so it doesn't slow `cargo test`;
      # invoke it explicitly here (release build for accurate numbers).
      # target-cpu=native so the reported number reflects the runner's full
      # ISA (AES-NI/AVX2 paths) rather than the generic x86-64 baseline.
      run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_protocol_throughput -- --ignored --nocapture

  # Cross-language e2e suites (scripts/e2e_test.sh): the 档 A/B/C/D acceptance
  # matrix, session_token hijack, pad_mode, min_enc policy and the cfg suite
  # (per-field config interop plus config validation) — all driven by the
  # in-memory TAP probes. No CAP_NET_ADMIN and no root required, so these
  # run for real on hosted runners (net-perf below is the one that self-skips).
  e2e-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Checkout Go implementation (cross-language matrix)
      uses: actions/checkout@v4
      with:
        repository: NNdroid/tlsvpn
        path: go-impl

    - name: Record the Go commit this run builds
      run: |
        # Both repos are checked out at their tips on purpose: the cross-language
        # matrix is what catches protocol divergence between the two
        # implementations. Do NOT pin a ref here — a pin would hide real
        # divergence behind whichever Go commit it points at.
        git -C go-impl log -1 --format='go-impl @ %h (%s)'
        cat <<'EOF'
        If the Go build below fails on tlsvpn source, the break is in NNdroid/tlsvpn,
        not in Rust, and no change to this repo can make this job green. Check the
        Go repo's CI for the SHA printed above: its TestCrossCompileLinuxMatrix
        covers every release target and normally catches these before push.
        EOF

    - name: Build Rust binary and probe
      run: |
        bash scripts/build.sh native
        cargo build --examples

    - name: Build Go binary and probe
      run: |
        (cd go-impl && bash scripts/build.sh)
        # The probe is tracked in the Go repo (tlsvpn/interop/probe.go), which is
        # where E2E_GO_PROBE looks. An earlier vendored interop/ copy lived here as
        # a superset (22 flags vs 7); no script ever used any of the extra flags, so
        # it was deleted. The Go repo is the only probe source now.
        (cd go-impl && go build -C interop -o probe .)

    - name: Cross-language e2e (accept / tok / pad / minenc / cfg)
      env:
        E2E_RS_BIN: ${{ github.workspace }}/dist/tlsvpn
        # E2E_GO_DIR is what E2E_GO_PROBE's default is built from. Left unset it
        # falls back to <repo>/../tlsvpn, which does not exist on a runner — the
        # Go checkout lives at go-impl — so every cross-language case aborted with
        # "缺少依赖: E2E_GO_PROBE".
        E2E_GO_DIR: ${{ github.workspace }}/go-impl
        E2E_GO_BIN: ${{ github.workspace }}/go-impl/bin/tlsvpn_linux_amd64
      run: bash scripts/e2e_test.sh

  # Network performance tests over a REAL TAP tunnel: ping (v4/v6, 0% loss),
  # traceroute (v4/v6 through the tunnel), iperf3 up/down throughput and an
  # optional librespeed run (scripts/net_perf_test.sh).
  #
  # The script is capability-gated and reports SKIP + exits 0 on an
  # environment that cannot run a tunnel (job stays green, and the precise
  # missing step is in the job log). The gate tests the whole RTNL path,
  # not just TAP creation: ubuntu-latest passes TUNSETIFF while refusing
  # RTNL, so "can I create a TAP?" alone reports capability the runner does
  # not actually have — the server then died before binding its port and the
  # job failed with an unexplained "server did not start". Point runs-on at
  # a privileged self-hosted runner to execute the checks for real.
  net-perf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Checkout Go implementation (cross-language matrix)
      uses: actions/checkout@v4
      with:
        repository: NNdroid/tlsvpn
        path: go-impl

    - name: Record the Go commit this run builds
      run: |
        # Both repos are checked out at their tips on purpose: the cross-language
        # matrix is what catches protocol divergence between the two
        # implementations. Do NOT pin a ref here — a pin would hide real
        # divergence behind whichever Go commit it points at.
        git -C go-impl log -1 --format='go-impl @ %h (%s)'
        cat <<'EOF'
        If the Go build below fails on tlsvpn source, the break is in NNdroid/tlsvpn,
        not in Rust, and no change to this repo can make this job green. Check the
        Go repo's CI for the SHA printed above: its TestCrossCompileLinuxMatrix
        covers every release target and normally catches these before push.
        EOF

    - name: Build Rust binary (scripts/build.sh native)
      run: bash scripts/build.sh native

    - name: Build Go binary (Go repo's own scripts/build.sh)
      run: (cd go-impl && bash scripts/build.sh)

    - name: rs_srv <- rs_cli (ping / traceroute / throughput)
      env:
        BIN_SRV: ${{ github.workspace }}/dist/tlsvpn
        BIN_CLI: ${{ github.workspace }}/dist/tlsvpn
        FLAVOR_SRV: rs
        FLAVOR_CLI: rs
      run: sudo -E bash scripts/net_perf_test.sh

    - name: rs_srv <- go_cli (cross-language)
      env:
        BIN_SRV: ${{ github.workspace }}/dist/tlsvpn
        BIN_CLI: ${{ github.workspace }}/go-impl/bin/tlsvpn_linux_amd64
        FLAVOR_SRV: rs
        FLAVOR_CLI: go
      run: sudo -E bash scripts/net_perf_test.sh

    - name: go_srv <- rs_cli (cross-language)
      env:
        BIN_SRV: ${{ github.workspace }}/go-impl/bin/tlsvpn_linux_amd64
        BIN_CLI: ${{ github.workspace }}/dist/tlsvpn
        FLAVOR_SRV: go
        FLAVOR_CLI: rs
      run: sudo -E bash scripts/net_perf_test.sh
