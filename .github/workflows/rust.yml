name: Rust Tests and Benchmark

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --verbose

    - name: Test Core Logic
      run: cargo test --verbose

    - name: Verify protocol golden vectors (cross-language contract)
      env:
        TLSVPN_GOLDEN: "testdata/protocol_golden.json"
      run: |
        # Fetch the shared golden vector generated by the Go implementation.
        curl -fsSL -o testdata/protocol_golden.json \
          "https://raw.githubusercontent.com/NNdroid/tlsvpn/main/testdata/protocol_golden.json" \
          || echo "golden vector fetch failed — running without cross-check"
        cargo test --verbose --test protocol_conformance

    - name: Benchmark Protocol
      # bench_protocol_throughput is #[ignore]d so it doesn't slow `cargo test`;
      # invoke it explicitly here (release build for accurate numbers).
      # target-cpu=native so the reported number reflects the runner's full
      # ISA (AES-NI/AVX2 paths) rather than the generic x86-64 baseline.
      run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_protocol_throughput -- --ignored --nocapture

  # Cross-language e2e suites (scripts/e2e_test.sh): the 档 A/B/C/D acceptance
  # matrix, session_token hijack, pad_mode and min_enc policy — 73 cases driven
  # by the in-memory TAP probes. No CAP_NET_ADMIN and no root required, so these
  # run for real on hosted runners (net-perf below is the one that self-skips).
  e2e-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Checkout Go implementation (cross-language matrix)
      uses: actions/checkout@v4
      with:
        repository: NNdroid/tlsvpn
        path: go-impl

    - name: Build Rust binary and probe
      run: |
        bash scripts/build.sh native
        cargo build --examples

    - name: Build Go binary and probe
      run: |
        (cd go-impl && bash scripts/build.sh)
        go build -C interop -o probe .

    - name: Cross-language e2e (accept / tok / pad / minenc)
      env:
        E2E_RS_BIN: ${{ github.workspace }}/dist/tlsvpn
        E2E_GO_BIN: ${{ github.workspace }}/go-impl/bin/tlsvpn_linux_amd64
      run: bash scripts/e2e_test.sh

  # Network performance tests over a REAL TAP tunnel: ping (v4/v6, 0% loss),
  # traceroute (v4/v6 through the tunnel), iperf3 up/down throughput and an
  # optional librespeed run (scripts/net_perf_test.sh).
  #
  # The script is capability-gated: GitHub-hosted runners have no
  # CAP_NET_ADMIN, so there it reports SKIP and exits 0 (job stays green,
  # the reason is visible in the job log). Point runs-on at a privileged
  # self-hosted runner to execute the checks for real.
  net-perf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Checkout Go implementation (cross-language matrix)
      uses: actions/checkout@v4
      with:
        repository: NNdroid/tlsvpn
        path: go-impl

    - name: Build Rust binary (scripts/build.sh native)
      run: bash scripts/build.sh native

    - name: Build Go binary (Go repo's own scripts/build.sh)
      run: (cd go-impl && bash scripts/build.sh)

    - name: rs_srv <- rs_cli (ping / traceroute / throughput)
      env:
        BIN_SRV: ${{ github.workspace }}/dist/tlsvpn
        BIN_CLI: ${{ github.workspace }}/dist/tlsvpn
        FLAVOR_SRV: rs
        FLAVOR_CLI: rs
      run: sudo -E bash scripts/net_perf_test.sh

    - name: rs_srv <- go_cli (cross-language)
      env:
        BIN_SRV: ${{ github.workspace }}/dist/tlsvpn
        BIN_CLI: ${{ github.workspace }}/go-impl/bin/tlsvpn_linux_amd64
        FLAVOR_SRV: rs
        FLAVOR_CLI: go
      run: sudo -E bash scripts/net_perf_test.sh

    - name: go_srv <- rs_cli (cross-language)
      env:
        BIN_SRV: ${{ github.workspace }}/go-impl/bin/tlsvpn_linux_amd64
        BIN_CLI: ${{ github.workspace }}/dist/tlsvpn
        FLAVOR_SRV: go
        FLAVOR_CLI: rs
      run: sudo -E bash scripts/net_perf_test.sh
