name: Apply Rust Protocol v3 Migration

on:
  push:
    branches:
      - protocol/v3-dynamic-fec
    paths:
      - scripts/apply_protocol_v3_dynamic_fec.py
      - .github/workflows/apply_protocol_v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply protocol v3 + dynamic FEC migration
        run: |
          python3 scripts/apply_protocol_v3_dynamic_fec.py
          # Fix two source-generation edges before validation. The transformer is
          # one-shot and is removed after the validated source commit.
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/net.rs')
          s=p.read_text()
          old='''    fn send_payload_to(&self, b: &Backend, seq: u32, data: FramePayload) -> u64 {
              match self.try_send_payload_to_fenced(b, seq, data, control) {'''
          new='''    fn send_payload_to(&self, b: &Backend, seq: u32, data: FramePayload) -> u64 {
              match self.try_send_payload_to(b, seq, data) {'''
          if old not in s:
              raise SystemExit('generated net.rs send_payload_to edge not found')
          s=s.replace(old,new,1)
          s=s.replace('use crate::buffer::{release_frame_vec, release_shared_frame};',
                      'use crate::buffer::release_frame_vec;',1)
          p.write_text(s)

          p=Path('src/fec.rs')
          s=p.read_text()
          s=s.replace('let mut complete = false;', 'let complete;', 1)
          s=s.replace('.map_err(|e| format!("FEC_PARITY AEAD failure: {e}"))?;',
                      '.map_err(|_| "FEC_PARITY AEAD failure".to_string())?;',1)
          p.write_text(s)

          p=Path('src/server.rs')
          s=p.read_text().replace('use crate::fec::{self, FecDecoder};',
                                  'use crate::fec::FecDecoder;',1)
          p.write_text(s)
          PY
          # Integration tests/examples are separate crate roots and therefore
          # cannot resolve crate::protocol from the tlsvpn binary crate.
          sed -i 's/crate::protocol::PROTOCOL_VERSION/3/g' tests/protocol_conformance.rs examples/interop_client.rs
          cargo fmt --all

      - name: Fetch protocol-v3 Go golden contract
        run: |
          mkdir -p testdata
          curl -fsSL -o testdata/protocol_golden.json \
            https://raw.githubusercontent.com/NNdroid/tlsvpn/research/dynamic-rx-fec-bypass/testdata/protocol_golden.json
          python3 - <<'PY'
          import json
          g=json.load(open('testdata/protocol_golden.json'))
          assert g['version'] == 3
          controls={v['name']:v['payload_hex'] for v in g['control_frames']}
          assert controls['fec_mode_suspend'] == '02010000010203040506070800000009'
          assert controls['fec_parity_k2'].startswith('01')
          PY

      - name: Reject legacy protocol semantics
        run: |
          if grep -R --line-number --include='*.rs' -E 'protocol_version:[[:space:]]*2|protocol_version != 2|protocol_version == 2|FEC_MAGIC|0xFE|protocol-v2|protocol v2' src tests examples; then
            echo 'legacy protocol-v2 semantics remain'
            exit 1
          fi
          test -s docs/protocol_v3.md
          grep -Fq 'protocol_version = 3' docs/protocol_v3.md
          grep -Fq '0x01  FEC_PARITY' docs/protocol_v3.md
          grep -Fq '0x02  FEC_MODE' docs/protocol_v3.md
          grep -Fq 'Physical path failure and rejoin' docs/protocol_v3.md

      - name: Build
        shell: bash
        run: |
          set +e
          cargo check --all-targets --message-format=short >cargo-check.log 2>&1
          status=$?
          grep -E '(^|: )(error|warning)(\[|:)|error:|warning:' cargo-check.log || true
          tail -n 40 cargo-check.log
          exit $status

      - name: Test protocol v3 and dynamic FEC
        env:
          TLSVPN_GOLDEN: ${{ github.workspace }}/testdata/protocol_golden.json
        run: |
          cargo test
          cargo test --test protocol_conformance

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Commit validated migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests examples testdata Cargo.toml Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'migration already applied'
            exit 0
          fi
          git commit -m 'protocol: migrate Rust data plane to v3 dynamic FEC'
          git push origin HEAD:protocol/v3-dynamic-fec
