name: v42 retry async client TAP delivery

on:
  push:
    branches:
      - perf/client-tap-delivery-v42

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch client RX TAP delivery
        shell: bash
        env:
          PATCH_GZ_B64: ""
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/v42_patch.py
          python3 /tmp/v42_patch.py
      - name: Check Linux build
        run: cargo check --all-targets
      - name: Run tests
        run: cargo test --all-targets
      - name: Commit experiment and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/v42-one-shot.yml .github/workflows/v42-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs .github/workflows/v42-one-shot.yml .github/workflows/v42-fix.yml
          git commit -m 'perf(client): decouple TAP delivery from TLS reads'
          git push origin HEAD:perf/client-tap-delivery-v42
