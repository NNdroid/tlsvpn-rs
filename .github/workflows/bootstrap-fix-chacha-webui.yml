name: Bootstrap ChaCha WebUI display fix

on:
  push:
    branches: [ "feat/chacha-inner-aead" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: feat/chacha-inner-aead

    - uses: dtolnay/rust-toolchain@stable

    - name: Patch WebUI algorithm labels
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p = Path('src/api.rs')
        s = p.read_text()
        replacements = {
            "function encBadge(a){if(a===2)return '<span class=\\\"badge b-on\\\">AES-256-GCM</span>';\n  if(a===4)return '<span class=\\\"badge b-on\\\">AES-128-GCM</span>';\n  return '<span class=\\\"badge b-off\\\">明文</span>';}":
            "function encBadge(a){if(a===2)return '<span class=\\\"badge b-on\\\">AES-256-GCM</span>';\n  if(a===4)return '<span class=\\\"badge b-on\\\">AES-128-GCM</span>';\n  if(a===5)return '<span class=\\\"badge b-on\\\">ChaCha20-Poly1305</span>';\n  if(a===6)return '<span class=\\\"badge b-on\\\">XChaCha20-Poly1305</span>';\n  return '<span class=\\\"badge b-off\\\">明文</span>';}",
            "const meta=[];if(data.enc_algo===2)meta.push('AES-256-GCM');else if(data.enc_algo===4)meta.push('AES-128-GCM');":
            "const meta=[];if(data.enc_algo===2)meta.push('AES-256-GCM');else if(data.enc_algo===4)meta.push('AES-128-GCM');else if(data.enc_algo===5)meta.push('ChaCha20-Poly1305');else if(data.enc_algo===6)meta.push('XChaCha20-Poly1305');",
            "['内层加密算法',g.enc_algo===2?'AES-256-GCM':(g.enc_algo?'未知('+g.enc_algo+')':'明文（未启用）')],":
            "['内层加密算法',g.enc_algo===2?'AES-256-GCM':g.enc_algo===4?'AES-128-GCM':g.enc_algo===5?'ChaCha20-Poly1305':g.enc_algo===6?'XChaCha20-Poly1305':(g.enc_algo?'未知('+g.enc_algo+')':'明文（未启用）')],",
        }
        for old, new in replacements.items():
            count = s.count(old)
            if count != 1:
                raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
            s = s.replace(old, new)
        p.write_text(s)
        PY
        grep -Fq "if(a===5)return '<span class=\"badge b-on\">ChaCha20-Poly1305</span>'" src/api.rs
        grep -Fq "if(a===6)return '<span class=\"badge b-on\">XChaCha20-Poly1305</span>'" src/api.rs
        cargo fmt --all -- --check
        cargo test --all --all-targets

    - name: Commit fix
      run: |
        rm -f .github/workflows/bootstrap-fix-chacha-webui.yml
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add src/api.rs .github/workflows/bootstrap-fix-chacha-webui.yml
        git commit -m 'fix(webui): display ChaCha inner AEAD algorithms'
        git push origin HEAD:feat/chacha-inner-aead
