name: Dataplane RX batch patch

on:
  push:
    branches:
      - perf/dataplane-hotpath-20260928
    paths:
      - scripts/perf_opt_phase2.py
      - .github/workflows/perf-opt-phase2.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/dataplane-hotpath-20260928
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply batch patch
        run: python3 scripts/perf_opt_phase2.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --verbose

      - name: Release protocol benchmark smoke test
        run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_protocol_throughput -- --ignored --nocapture

      - name: Commit RX batching
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fec.rs src/client.rs src/server.rs
          git commit -m "perf: batch Rust FEC and reorder receive processing"
          git push origin HEAD:perf/dataplane-hotpath-20260928
