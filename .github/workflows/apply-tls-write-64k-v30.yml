name: Apply TLS write 64K experiment

on:
  push:
    branches:
      - perf/tls-write-64k-v30

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/tls-write-64k-v30
      - name: Apply focused batch-size patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'const TLS_WRITE_BATCH_BYTES: usize = 32 * 1024;'
          new = 'const TLS_WRITE_BATCH_BYTES: usize = 64 * 1024;'
          for name in ('src/client.rs', 'src/server.rs'):
              p = Path(name)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected one 32KiB TLS batch constant, found {n}')
              p.write_text(s.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit experiment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client.rs src/server.rs
          git commit -m 'perf: raise TLS plaintext batch to 64 KiB'
          git push origin HEAD:perf/tls-write-64k-v30
