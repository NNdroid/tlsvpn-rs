name: Bootstrap Rust peer metadata WebUI
on:
  push:
    branches:
      - feat/peer-info-handshake
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/peer-info-handshake
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch WebUI
        run: python3 scripts/bootstrap_peer_ui.py
      - name: Validate
        run: |
          cargo test --all --all-targets
          cargo check --release
      - name: Commit implementation
        run: |
          rm -f .github/workflows/bootstrap-peer-ui.yml scripts/bootstrap_peer_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(webui): display handshake peer metadata"
          git push origin HEAD:feat/peer-info-handshake
