name: Apply pretty generated JSON fix

on:
  push:
    branches: [ "fix/pretty-generated-json" ]
    paths:
      - ".github/scripts/patch_pretty_config.py"
      - ".github/workflows/apply_pretty_config_fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python3 .github/scripts/patch_pretty_config.py
      - name: Validate
        run: |
          rustfmt --check tests/installer_config_format.rs
          bash -n scripts/install.sh
          cargo test --test installer_config_format --verbose
          git diff --check
      - name: Commit product changes
        run: |
          rustfmt tests/installer_config_format.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install.sh tests/installer_config_format.rs
          git commit -m 'fix: pretty-print generated installer JSON' || exit 0
          git push origin HEAD:fix/pretty-generated-json
