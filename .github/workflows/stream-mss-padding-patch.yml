name: Apply stream MSS padding upgrade

on:
  push:
    branches: [ "perf/stream-mss-padding-20260928" ]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python3 scripts/apply_stream_mss_padding.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: |
          cargo test --verbose
          RUSTFLAGS='-C target-cpu=native' cargo test --release bench_protocol_throughput -- --ignored --nocapture
      - name: Commit final source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stream-mss-padding-patch.yml scripts/apply_stream_mss_padding.py
          git add -A
          git commit -m 'perf: align TLS stream padding to TCP MSS'
          git push origin HEAD:perf/stream-mss-padding-20260928
