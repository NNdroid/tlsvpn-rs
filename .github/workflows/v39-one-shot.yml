name: v39 one-shot dynamic client writable interest

on:
  push:
    branches:
      - perf/client-dynamic-writable-v39

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dynamic writable interest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/client.rs')
          s = p.read_text()

          old = '''    // 握手完成后只关注可读（修复写就绪恒触发导致的空转）
              let _ = poll
                  .registry()
                  .reregister(&mut sock, TOKEN_CONN, Interest::READABLE);
          '''
          new = '''    // 握手完成后默认只关注可读，避免永久 WRITABLE interest 导致空转。
              // 数据面只有在 write_tls() 真正返回 WouldBlock 时才临时订阅 WRITABLE。
              let _ = poll
                  .registry()
                  .reregister(&mut sock, TOKEN_CONN, client_socket_interest(false));
          '''
          if old not in s:
              raise SystemExit('post-handshake interest anchor not found')
          s = s.replace(old, new, 1)

          old = '''    let mut last_keepalive = Instant::now();
              let mut last_rx = Instant::now();
              let mut last_write_progress = Instant::now();
              let mut next_rtt_refresh = Instant::now();
          '''
          new = '''    let mut last_keepalive = Instant::now();
              let mut last_rx = Instant::now();
              let mut last_write_progress = Instant::now();
              // Keep WRITABLE disabled on the hot path. Enable it only after the
              // kernel socket actually backpressures write_tls(), then remove it
              // again as soon as rustls ciphertext is fully drained.
              let mut write_blocked = false;
              let mut next_rtt_refresh = Instant::now();
          '''
          if old not in s:
              raise SystemExit('loop state anchor not found')
          s = s.replace(old, new, 1)

          marker = '        // 冲刷写队列（非阻塞；WouldBlock 等下次 poll 后重试）\n'
          if marker not in s:
              raise SystemExit('write loop marker not found')
          prefix, tail = s.split(marker, 1)

          old = '''                Err(e)
                              if e.kind() == std::io::ErrorKind::WouldBlock
                                  || e.kind() == std::io::ErrorKind::TimedOut =>
                          {
                              break
                          }
          '''
          new = '''                Err(e)
                              if e.kind() == std::io::ErrorKind::WouldBlock
                                  || e.kind() == std::io::ErrorKind::TimedOut =>
                          {
                              // Normally the data loop listens only for READABLE. Once
                              // the kernel socket backpressures, subscribe to WRITABLE so
                              // send-buffer recovery wakes us immediately instead of
                              // waiting for the RTT/reorder timer.
                              if !write_blocked {
                                  if let Err(reg_err) = poll.registry().reregister(
                                      &mut sock,
                                      TOKEN_CONN,
                                      client_socket_interest(true),
                                  ) {
                                      close_reason = format!(
                                          "mio reregister writable after TLS backpressure failed: {reg_err}"
                                      );
                                      conn_closed = true;
                                  } else {
                                      write_blocked = true;
                                  }
                              }
                              break
                          }
          '''
          if old not in tail:
              raise SystemExit('write_tls backpressure block not found')
          tail = tail.replace(old, new, 1)

          stall_anchor = '        if last_write_progress.elapsed() > Duration::from_secs(10) {\n'
          restore = '''        if write_blocked && !tls.wants_write() && !conn_closed {
              if let Err(reg_err) = poll.registry().reregister(
                  &mut sock,
                  TOKEN_CONN,
                  client_socket_interest(false),
              ) {
                  close_reason = format!(
                      "mio restore read-only interest after TLS drain failed: {reg_err}"
                  );
                  conn_closed = true;
              } else {
                  write_blocked = false;
              }
          }

          '''
          if stall_anchor not in tail:
              raise SystemExit('write stall anchor not found')
          tail = tail.replace(stall_anchor, restore + stall_anchor, 1)
          s = prefix + marker + tail

          old = '''#[inline]
          fn clamp_poll_for_tx_backlog(
              base: Duration,
              tx_backlog: bool,
              tls_wants_write: bool,
          ) -> Duration {
          '''
          new = '''#[inline]
          fn client_socket_interest(write_blocked: bool) -> Interest {
              if write_blocked {
                  Interest::READABLE | Interest::WRITABLE
              } else {
                  Interest::READABLE
              }
          }

          #[inline]
          fn clamp_poll_for_tx_backlog(
              base: Duration,
              tx_backlog: bool,
              tls_wants_write: bool,
          ) -> Duration {
          '''
          if old not in s:
              raise SystemExit('helper anchor not found')
          s = s.replace(old, new, 1)

          old = '''mod tx_poll_tests {
              use super::clamp_poll_for_tx_backlog;
              use std::time::Duration;

              #[test]
              fn queued_tx_without_tls_backpressure_never_sleeps() {
          '''
          new = '''mod tx_poll_tests {
              use super::{clamp_poll_for_tx_backlog, client_socket_interest};
              use std::time::Duration;

              #[test]
              fn writable_interest_is_only_enabled_for_real_backpressure() {
                  let normal = client_socket_interest(false);
                  assert!(normal.is_readable());
                  assert!(!normal.is_writable());

                  let blocked = client_socket_interest(true);
                  assert!(blocked.is_readable());
                  assert!(blocked.is_writable());
              }

              #[test]
              fn queued_tx_without_tls_backpressure_never_sleeps() {
          '''
          if old not in s:
              raise SystemExit('test module anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Check Linux build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit experiment and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v39-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs .github/workflows/v39-one-shot.yml
          git commit -m 'perf(client): wake on writable after TLS backpressure'
          git push origin HEAD:perf/client-dynamic-writable-v39
