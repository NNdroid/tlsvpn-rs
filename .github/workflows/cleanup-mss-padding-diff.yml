name: Clean MSS padding diff

on:
  push:
    branches:
      - perf/mss-aware-padding-20260928

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore unrelated rustfmt changes
        run: |
          git fetch origin main
          git checkout origin/main -- \
            src/api.rs \
            src/hooks.rs \
            src/utils.rs \
            src/web_parity.rs \
            tests/dashboard_script_test.rs \
            tests/gen_golden.rs \
            tests/protocol_conformance.rs \
            tests/version_readme_contract.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-mss-padding-diff.yml
          git add -A
          git commit -m 'chore: keep MSS padding diff focused'
          git push origin HEAD:perf/mss-aware-padding-20260928
