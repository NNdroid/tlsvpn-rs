name: Dataplane perf patch

on:
  push:
    branches:
      - perf/dataplane-hotpath-20260928
    paths:
      - scripts/perf_opt_patch.py
      - .github/workflows/perf-opt-patch.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/dataplane-hotpath-20260928
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply patch
        run: python3 scripts/perf_opt_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --verbose

      - name: Release protocol benchmark smoke test
        run: RUSTFLAGS="-C target-cpu=native" cargo test --release bench_protocol_throughput -- --ignored --nocapture

      - name: Commit optimized dataplane
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/buffer.rs src/frame.rs src/client.rs src/server.rs src/net.rs src/fec.rs
          git commit -m "perf: reduce Rust dataplane per-frame overhead"
          git push origin HEAD:perf/dataplane-hotpath-20260928
