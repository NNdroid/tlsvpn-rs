name: v36 one-shot client backlog poll

on:
  push:
    branches:
      - perf/client-backlog-poll-v36

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch client backlog poll behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/client.rs')
          s = p.read_text()

          old = '''        if let Some(wait) = cl.reorder_buf.lock().next_timeout() {
                      poll_timeout = poll_timeout.min(wait);
                  }
                  if let Err(e) = poll.poll(&mut events, Some(poll_timeout)) {
          '''
          new = '''        if let Some(wait) = cl.reorder_buf.lock().next_timeout() {
                      poll_timeout = poll_timeout.min(wait);
                  }
                  // BackendNotify coalesces producer wakeups. One wake can therefore
                  // represent more than one TLS plaintext batch. If frames remain
                  // queued after the previous 32 KiB drain and rustls is not blocked
                  // on socket writes, poll nonblocking so we service that backlog
                  // immediately while still observing socket readability.
                  poll_timeout = clamp_poll_for_tx_backlog(
                      poll_timeout,
                      !rx.is_empty(),
                      tls.wants_write(),
                  );
                  if let Err(e) = poll.poll(&mut events, Some(poll_timeout)) {
          '''
          if old not in s:
              raise SystemExit('poll timeout anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''const TOKEN_CONN: mio::Token = mio::Token(1);
          const TOKEN_WAKE: mio::Token = mio::Token(2);
          '''
          helper = '''#[inline]
          fn clamp_poll_for_tx_backlog(
              base: Duration,
              tx_backlog: bool,
              tls_wants_write: bool,
          ) -> Duration {
              if tx_backlog && !tls_wants_write {
                  Duration::ZERO
              } else {
                  base
              }
          }

          #[cfg(test)]
          mod tx_poll_tests {
              use super::clamp_poll_for_tx_backlog;
              use std::time::Duration;

              #[test]
              fn queued_tx_without_tls_backpressure_never_sleeps() {
                  assert_eq!(
                      clamp_poll_for_tx_backlog(Duration::from_millis(200), true, false),
                      Duration::ZERO
                  );
              }

              #[test]
              fn no_backlog_keeps_timer_and_tls_backpressure_does_not_spin() {
                  let base = Duration::from_millis(200);
                  assert_eq!(clamp_poll_for_tx_backlog(base, false, false), base);
                  assert_eq!(clamp_poll_for_tx_backlog(base, true, true), base);
              }
          }

          const TOKEN_CONN: mio::Token = mio::Token(1);
          const TOKEN_WAKE: mio::Token = mio::Token(2);
          '''
          if anchor not in s:
              raise SystemExit('TOKEN anchor not found')
          p.write_text(s.replace(anchor, helper, 1))
          PY

      - name: Check Linux build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit experiment and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v36-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs .github/workflows/v36-one-shot.yml
          git commit -m 'perf(client): avoid sleeping with queued TX backlog'
          git push origin HEAD:perf/client-backlog-poll-v36
