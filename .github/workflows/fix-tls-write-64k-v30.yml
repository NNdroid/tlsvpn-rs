name: Normalize TLS write 64K experiment

on:
  push:
    branches:
      - perf/tls-write-64k-v30

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/tls-write-64k-v30
          fetch-depth: 0
      - name: Restore main formatting and apply only two constants
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- src/client.rs src/server.rs
          python3 - <<'PY'
          from pathlib import Path
          old = 'const TLS_WRITE_BATCH_BYTES: usize = 32 * 1024;'
          new = 'const TLS_WRITE_BATCH_BYTES: usize = 64 * 1024;'
          for name in ('src/client.rs', 'src/server.rs'):
              p = Path(name)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected one constant, found {n}')
              p.write_text(s.replace(old, new))
          PY
          git diff --check
          test "$(git diff --numstat origin/main -- src/client.rs src/server.rs | awk '{a+=$1; d+=$2} END {print a+0, d+0}')" = '2 2'
      - name: Commit normalized experiment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/client.rs src/server.rs
          git commit -m 'perf: normalize TLS 64 KiB batch experiment'
          git push origin HEAD:perf/tls-write-64k-v30
