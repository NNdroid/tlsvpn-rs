name: Temporary WebUI TDZ Codemod

on:
  push:
    branches: [ "fix/webui-browser-smoke" ]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webui-browser-smoke
      - name: Apply TDZ fix
        run: python3 scripts/tmp_fix_webui_tdz.py
      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(webui): remove i18n LANG TDZ'
          git push origin HEAD:fix/webui-browser-smoke
