name: One-shot dropdown scroll fix

on:
  push:
    branches:
      - parity/go-main-20261001
    paths:
      - .github/workflows/dropdown-scroll-fix-temp.yml
      - scripts/dropdown_scroll_fix_temp.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/go-main-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch dropdown scroll handling
        run: python3 scripts/dropdown_scroll_fix_temp.py
      - name: Check i18n coverage
        run: node scripts/check_i18n.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke
        run: node scripts/webui_browser_smoke.mjs
      - name: Commit product fix and self-clean
        run: |
          rm -f scripts/dropdown_scroll_fix_temp.py .github/workflows/dropdown-scroll-fix-temp.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'webui: keep custom dropdown positioned during scroll'
          git push origin HEAD:parity/go-main-20261001
