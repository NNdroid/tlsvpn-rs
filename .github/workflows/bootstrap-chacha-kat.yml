name: Bootstrap ChaCha KAT

on:
  push:
    branches:
      - 'feat/chacha-inner-aead'

permissions:
  contents: write

jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Add vectors and test
        run: |
          python3 scripts/add_chacha_kat.py
          cargo fmt --all
          cargo test --all --all-targets
      - name: Commit vectors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/add_chacha_kat.py .github/workflows/bootstrap-chacha-kat.yml
          git add src/crypto.rs
          git commit -m 'test(crypto): lock Go ChaCha AEAD vectors'
          git push origin HEAD:feat/chacha-inner-aead
