name: v35 one-shot direct TAP burst

on:
  push:
    branches:
      - perf/tap-direct-burst-v35

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch same-thread TAP burst path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/tap.rs')
          s = p.read_text()
          s = s.replace(
              'use std::io;\nuse tun_rs::SyncDevice;\n',
              'use std::io;\nuse tun_rs::SyncDevice;\n\n#[cfg(target_os = "linux")]\nuse std::os::fd::AsRawFd;\n',
              1,
          )
          old = '''pub trait TapDevice: Send + Sync {
              fn send(&self, data: &[u8]) -> io::Result<()>;
              fn recv(&self, buf: &mut [u8]) -> io::Result<usize>;
          }
          '''
          new = '''pub trait TapDevice: Send + Sync {
              fn send(&self, data: &[u8]) -> io::Result<()>;
              fn recv(&self, buf: &mut [u8]) -> io::Result<usize>;

              /// True when another frame can be read immediately without changing
              /// the TAP fd to nonblocking mode. The default keeps other platforms
              /// and the in-memory backend on the original single-frame path.
              fn rx_ready_now(&self) -> io::Result<bool> {
                  Ok(false)
              }
          }
          '''
          if old not in s:
              raise SystemExit('TapDevice trait anchor not found')
          s = s.replace(old, new, 1)

          old = '''impl TapDevice for SyncDevice {
              fn send(&self, data: &[u8]) -> io::Result<()> {
                  SyncDevice::send(self, data).map(|_| ())
              }
              fn recv(&self, buf: &mut [u8]) -> io::Result<usize> {
                  SyncDevice::recv(self, buf)
              }
          }
          '''
          new = '''impl TapDevice for SyncDevice {
              fn send(&self, data: &[u8]) -> io::Result<()> {
                  SyncDevice::send(self, data).map(|_| ())
              }
              fn recv(&self, buf: &mut [u8]) -> io::Result<usize> {
                  SyncDevice::recv(self, buf)
              }

              #[cfg(target_os = "linux")]
              fn rx_ready_now(&self) -> io::Result<bool> {
                  let mut pfd = libc::pollfd {
                      fd: self.as_raw_fd(),
                      events: libc::POLLIN,
                      revents: 0,
                  };
                  loop {
                      let rc = unsafe { libc::poll(&mut pfd, 1, 0) };
                      if rc > 0 {
                          return Ok((pfd.revents & libc::POLLIN) != 0);
                      }
                      if rc == 0 {
                          return Ok(false);
                      }
                      let err = io::Error::last_os_error();
                      if err.kind() != io::ErrorKind::Interrupted {
                          return Err(err);
                      }
                  }
              }
          }
          '''
          if old not in s:
              raise SystemExit('SyncDevice impl anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/net.rs')
          s = p.read_text()
          anchor = '''    /// Client TAP 等天然唯一 owner 的入口：直接移动 pooled Vec，避免每个以太帧
              /// 都为 Arc 控制块做一次 heap allocation/free。
              pub fn write_owned_frame(&self, frame: Vec<u8>) {
                  self.write_payload(FramePayload::Owned(frame));
              }

          '''
          replacement = '''    /// Client TAP 等天然唯一 owner 的入口：直接移动 pooled Vec，避免每个以太帧
              /// 都为 Arc 控制块做一次 heap allocation/free。
              pub fn write_owned_frame(&self, frame: Vec<u8>) {
                  self.write_payload(FramePayload::Owned(frame));
              }

              /// Same-thread TAP burst path. One backend snapshot and one encoder lock
              /// cover the already-owned burst; backend queues and wire framing remain
              /// per-frame, so no extra producer/consumer hop is introduced.
              pub fn write_owned_batch(&self, frames: &mut Vec<Vec<u8>>) {
                  if frames.is_empty() {
                      return;
                  }

                  let backends = self.backends.read();
                  if backends.is_empty()
                      || !backends.iter().any(|b| Self::backend_score(b).is_some())
                  {
                      let mut dropped = 0u64;
                      for frame in frames.drain(..) {
                          if !frame.is_empty() {
                              dropped += 1;
                          }
                          release_frame_vec(frame);
                      }
                      self.drop_n(dropped);
                      return;
                  }

                  let selected_idx = self.selected_data_backend_index(&backends);
                  let mut encoder = self.encoder.lock();
                  for frame in frames.drain(..) {
                      let frame = FramePayload::Owned(frame);
                      if frame.is_empty() {
                          frame.release();
                          continue;
                      }
                      let Some(seq) = self.next_seq() else {
                          self.drop_n(1);
                          frame.release();
                          continue;
                      };
                      let parity = encoder
                          .as_mut()
                          .and_then(|enc| enc.add(seq, frame.as_slice()));
                      let data_idx =
                          self.send_data_payload_to_any(&backends, selected_idx, seq, frame);
                      if let Some(par) = parity {
                          if backends.len() < 2 {
                              release_frame_vec(par);
                              continue;
                          }
                          self.parity_sent.fetch_add(1, Ordering::Relaxed);
                          let par = FramePayload::Owned(par);
                          if let Some(idx) = self.parity_backend_index(&backends, data_idx) {
                              self.send_payload_to(&backends[idx], 0, par);
                          } else {
                              self.drop_n(1);
                              par.release();
                          }
                      }
                  }
              }

          '''
          if anchor not in s:
              raise SystemExit('write_owned_frame anchor not found')
          s = s.replace(anchor, replacement, 1)

          test_anchor = '''    #[test]
              fn owned_payload_falls_back_without_payload_copy() {
          '''
          test = '''    #[test]
              fn owned_batch_preserves_sequence_and_payload_ownership() {
                  let port = AsyncPort::new("owned-batch".into());
                  let (backend, rx) = make_backend();
                  port.register_backend(backend);

                  let mut batch = Vec::with_capacity(8);
                  let mut ptrs = Vec::new();
                  for marker in 1u8..=4 {
                      let mut frame = crate::buffer::acquire_frame_vec(1400);
                      frame.clear();
                      frame.resize(1400, marker);
                      ptrs.push(frame.as_ptr());
                      batch.push(frame);
                  }

                  port.write_owned_batch(&mut batch);
                  assert!(batch.is_empty(), "batch ownership must be consumed");
                  for (idx, expected_ptr) in ptrs.into_iter().enumerate() {
                      let frame = rx.try_recv().expect("batched frame must reach backend");
                      assert_eq!(frame.seq, (idx + 1) as u32);
                      assert_eq!(frame.data.data_ptr(), expected_ptr);
                      assert_eq!(frame.data[frame.data.len() - 1], (idx + 1) as u8);
                      frame.data.release();
                  }
              }

              #[test]
              fn owned_payload_falls_back_without_payload_copy() {
          '''
          if test_anchor not in s:
              raise SystemExit('batch test anchor not found')
          p.write_text(s.replace(test_anchor, test, 1))

          p = Path('src/client.rs')
          s = p.read_text()
          start_marker = '    // TAP 读线程 → 端口（对齐 Go 客户端 TAP 读协程）\n'
          end_marker = '\n\n    let reorder_buf = Arc::new(Mutex::new(ReorderBuffer::new()));'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('client TAP reader range not found')
          new_block = '''    // TAP 读线程：首帧保持阻塞读取；若 Linux fd 上已经有更多帧，
              // 在同一线程内最多 drain 32 帧 / 32 KiB，再直接交给 AsyncPort。
              // 不增加 channel/dispatcher，也不启用 virtio/GSO。
              let tx_port = Arc::new(AsyncPort::new("client_tx_port".to_string()));
              {
                  let dev = device.clone();
                  let port = tx_port.clone();
                  let tap_read_size = crate::tap::tap_read_buffer_size(args.mtu);
                  std::thread::spawn(move || {
                      const MAX_BURST_BYTES: usize = 32 * 1024;
                      const MAX_BURST_FRAMES: usize = 32;
                      let mut batch = Vec::<Vec<u8>>::with_capacity(MAX_BURST_FRAMES);

                      loop {
                          if EXIT.load(Ordering::Relaxed) {
                              return;
                          }
                          let mut frame = acquire_frame_vec(tap_read_size);
                          match dev.recv(&mut frame) {
                              Ok(n) if n > 0 => {
                                  frame.truncate(n);
                                  let mut burst_bytes = n;
                                  batch.push(frame);

                                  while batch.len() < MAX_BURST_FRAMES
                                      && burst_bytes < MAX_BURST_BYTES
                                  {
                                      match dev.rx_ready_now() {
                                          Ok(true) => {}
                                          Ok(false) | Err(_) => break,
                                      }
                                      let mut next = acquire_frame_vec(tap_read_size);
                                      match dev.recv(&mut next) {
                                          Ok(m) if m > 0 => {
                                              next.truncate(m);
                                              burst_bytes = burst_bytes.saturating_add(m);
                                              batch.push(next);
                                          }
                                          Ok(_) => {
                                              release_frame_vec(next);
                                              break;
                                          }
                                          Err(_) => {
                                              release_frame_vec(next);
                                              break;
                                          }
                                      }
                                  }

                                  if batch.len() == 1 {
                                      port.write_owned_frame(batch.pop().unwrap());
                                  } else {
                                      port.write_owned_batch(&mut batch);
                                  }
                              }
                              Ok(_) => release_frame_vec(frame),
                              Err(_) => {
                                  release_frame_vec(frame);
                                  if EXIT.load(Ordering::Relaxed) {
                                      return;
                                  }
                                  std::thread::sleep(Duration::from_secs(1));
                              }
                          }
                      }
                  });
              }'''
          p.write_text(s[:start] + new_block + s[end:])
          PY

      - name: Check Linux build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit experiment and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v35-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs src/net.rs src/tap.rs .github/workflows/v35-one-shot.yml
          git commit -m 'perf: batch ready TAP frames in reader thread'
          git push origin HEAD:perf/tap-direct-burst-v35
