name: Traffic parity and installer polish helper v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/webui-install-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed product patch
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          from pathlib import Path

          old = subprocess.check_output([
              'git','show','56057b97ec1788fb04c00ff02aaa84562214c55f:.github/workflows/parity-polish-helper.yml'
          ], text=True)
          block = old.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(block)
          # The first helper's product patch was correct; only its optional appended
          # source-test string used literal \\n. Drop that section and add clean tests below.
          a = script.index('# Strengthen tests around the data contract and installer safety.')
          b = script.index("Path('.github/workflows/parity-polish-helper.yml').unlink()", a)
          script = script[:a] + script[b:]
          script = script.replace(
              "Path('.github/workflows/parity-polish-helper.yml').unlink()",
              "Path('.github/workflows/parity-polish-helper2.yml').unlink()",
              1,
          )
          exec(compile(script, '<traffic-parity-patch>', 'exec'), {'__name__':'__main__'})

          # AEAD labels moved to static webui/app.js when the Rust UI was aligned
          # with Go. Keep the workflow checking the real source of truth.
          p = Path('.github/workflows/crypto-interop.yml')
          s = p.read_text()
          s = s.replace('''      - "src/api.rs"\n''', '''      - "src/api.rs"\n      - "webui/app.js"\n''', 1)
          old_check = '''    - name: Verify WebUI inner-AEAD labels\n      run: |\n        grep -Fq "if(a===5)return '<span class=\\"badge b-on\\">ChaCha20-Poly1305</span>'" src/api.rs\n        grep -Fq "if(a===6)return '<span class=\\"badge b-on\\">XChaCha20-Poly1305</span>'" src/api.rs\n        grep -Fq "else if(data.enc_algo===5)meta.push('ChaCha20-Poly1305')" src/api.rs\n        grep -Fq "g.enc_algo===6?'XChaCha20-Poly1305'" src/api.rs\n'''
          new_check = '''    - name: Verify WebUI inner-AEAD labels\n      run: |\n        grep -Fq "ChaCha20-Poly1305" webui/app.js\n        grep -Fq "XChaCha20-Poly1305" webui/app.js\n        grep -Fq "enc_algo===5" webui/app.js\n        grep -Fq "enc_algo===6" webui/app.js\n'''
          if s.count(old_check) != 1:
              raise SystemExit('stale AEAD workflow check not found')
          p.write_text(s.replace(old_check, new_check, 1))

          p = Path('tests/dashboard_script_test.rs')
          s = p.read_text()
          if 'rust_webui_exposes_go_traffic_and_background_trend_contract' not in s:
              s += '''

#[test]
fn rust_webui_exposes_go_traffic_and_background_trend_contract() {
    let api = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/api.rs"))
        .expect("api.rs");
    let web = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/web_parity.rs"))
        .expect("web_parity.rs");
    let server = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/server.rs"))
        .expect("server.rs");
    let client = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("src/client.rs"))
        .expect("client.rs");
    for marker in ["start_dashboard_sampler", "traffic_json", "client_traffic", "trend_json(range)"] {
        assert!(api.contains(marker), "missing API parity marker {marker}");
    }
    for marker in ["TREND_MINUTE_CAP", "TrafficState", "client_snapshot", "apply_traffic_config"] {
        assert!(web.contains(marker), "missing traffic parity marker {marker}");
    }
    assert!(server.contains("global_tx_bytes"));
    assert!(client.contains("self.tx_bytes.load(Ordering::Relaxed)"));
}

#[test]
fn installer_does_not_start_tunnel_to_validate_generated_config() {
    let installer = fs::read_to_string(Path::new(env!("CARGO_MANIFEST_DIR")).join("scripts/install.sh"))
        .expect("install.sh");
    assert!(!installer.contains("-c \"$CONFIG_FILE.tmp\" >/dev/null 2>&1 &"));
    assert!(installer.contains("--renew-days"));
    assert!(installer.contains("LEGO_ARGS=(\"$action\""));
    for state_key in ["INSTALL_DIR=$(printf", "CONFIG_DIR=$(printf", "CERT_DIR=$(printf"] {
        assert!(installer.contains(state_key), "installer state missing {state_key}");
    }
}
'''
          p.write_text(s)
          PY
      - name: Validate product changes
        run: |
          chmod +x scripts/install.sh
          bash -n scripts/install.sh
          scripts/install.sh --help >/dev/null
          rustfmt --edition 2021 src/api.rs src/main.rs src/web_parity.rs src/server.rs src/client.rs tests/dashboard_script_test.rs
          cargo test --all-targets
          cargo check --release
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(webui): complete traffic and trend parity'
          git push origin HEAD:${{ github.head_ref }}
