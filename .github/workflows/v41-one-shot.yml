name: v41 one-shot reorder-native dedup

on:
  push:
    branches:
      - perf/reorder-dedup-v41

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove redundant hot-path dedup lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('src/client.rs')
          s = client.read_text()
          old = "                            if !cl.dedup.lock().is_duplicate(seq) {\n                                deliver_to_tap(&cl, seq, data, &mut reorder_ready);\n                            } else {\n                                release_shared_frame(data);\n                            }\n"
          new = "                            // ReorderBuffer already drops old/replayed seq values and\n                            // duplicate occupied slots. FEC processing happens before this\n                            // point, so the separate DeDuplicator mutex does not protect\n                            // the decoder either. Keep one delivery-dedup authority.\n                            deliver_to_tap(&cl, seq, data, &mut reorder_ready);\n"
          if old not in s:
              raise SystemExit('src/client.rs: hot-path dedup anchor not found')
          client.write_text(s.replace(old, new, 1))

          server = Path('src/server.rs')
          s = server.read_text()
          old = "                    if !c_sess.dedup.lock().is_duplicate(seq) {\n                        deliver_to_vswitch(&c_sess, core, seq, data, reorder_ready);\n                    } else {\n                        release_shared_frame(data);\n                    }\n"
          new = "                    // ReorderBuffer is the final delivery boundary and already\n                    // rejects both old/replayed seq values and duplicate occupied slots.\n                    // Avoid a second per-frame mutex + fixed-window lookup here.\n                    deliver_to_vswitch(&c_sess, core, seq, data, reorder_ready);\n"
          if old not in s:
              raise SystemExit('src/server.rs: hot-path dedup anchor not found')
          server.write_text(s.replace(old, new, 1))

          buf = Path('src/buffer.rs')
          s = buf.read_text()
          anchor = "    #[test]\n    fn idle_time_does_not_pre_age_a_future_gap() {\n"
          test = "    #[test]\n    fn buffered_duplicate_is_delivered_only_once_after_gap_fill() {\n        let mut rb = ReorderBuffer::new();\n        assert_eq!(rb.insert(1, Arc::new(vec![1])).len(), 1);\n\n        assert!(rb.insert(3, Arc::new(vec![0x33])).is_empty());\n        assert!(rb.insert(3, Arc::new(vec![0x99])).is_empty());\n\n        let ready = rb.insert(2, Arc::new(vec![0x22]));\n        assert_eq!(ready.len(), 2);\n        assert_eq!(ready[0].as_slice(), &[0x22]);\n        assert_eq!(ready[1].as_slice(), &[0x33]);\n    }\n\n    #[test]\n    fn idle_time_does_not_pre_age_a_future_gap() {\n"
          if anchor not in s:
              raise SystemExit('src/buffer.rs: test insertion anchor not found')
          buf.write_text(s.replace(anchor, test, 1))
          PY

      - name: Check Linux build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit experiment and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v41-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs src/server.rs src/buffer.rs .github/workflows/v41-one-shot.yml
          git commit -m 'perf: let reorder handle receive deduplication'
          git push origin HEAD:perf/reorder-dedup-v41
