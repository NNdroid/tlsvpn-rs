name: v41 one-shot reorder-native dedup

on:
  push:
    branches:
      - perf/reorder-dedup-v41

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove redundant hot-path dedup lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/client.rs': (
                  '''                            if !cl.dedup.lock().is_duplicate(seq) {
                                  deliver_to_tap(&cl, seq, data, &mut reorder_ready);
                              } else {
                                  release_shared_frame(data);
                              }
''',
                  '''                            // ReorderBuffer already drops both already-delivered old
                              // sequence numbers and duplicate in-window slots. FEC processing
                              // happens before this point, so the separate DeDuplicator mutex
                              // does not protect the decoder either. Let reorder be the single
                              // delivery-dedup authority on the receive hot path.
                              deliver_to_tap(&cl, seq, data, &mut reorder_ready);
'''
              ),
              'src/server.rs': (
                  '''                    if !c_sess.dedup.lock().is_duplicate(seq) {
                          deliver_to_vswitch(&c_sess, core, seq, data, reorder_ready);
                      } else {
                          release_shared_frame(data);
                      }
''',
                  '''                    // ReorderBuffer is the final delivery boundary and already
                      // rejects both old/replayed seq values and duplicate occupied slots.
                      // Avoid a second per-frame mutex + fixed-window lookup here.
                      deliver_to_vswitch(&c_sess, core, seq, data, reorder_ready);
'''
              ),
          }

          for name, (old, new) in replacements.items():
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{name}: hot-path dedup anchor not found')
              p.write_text(s.replace(old, new, 1))

          p = Path('src/buffer.rs')
          s = p.read_text()
          anchor = '''    #[test]
      fn idle_time_does_not_pre_age_a_future_gap() {
'''
          test = '''    #[test]
      fn buffered_duplicate_is_delivered_only_once_after_gap_fill() {
          let mut rb = ReorderBuffer::new();
          assert_eq!(rb.insert(1, Arc::new(vec![1])).len(), 1);

          assert!(rb.insert(3, Arc::new(vec![0x33])).is_empty());
          assert!(rb.insert(3, Arc::new(vec![0x99])).is_empty());

          let ready = rb.insert(2, Arc::new(vec![0x22]));
          assert_eq!(ready.len(), 2);
          assert_eq!(ready[0].as_slice(), &[0x22]);
          assert_eq!(ready[1].as_slice(), &[0x33]);
      }

      #[test]
      fn idle_time_does_not_pre_age_a_future_gap() {
'''
          if anchor not in s:
              raise SystemExit('src/buffer.rs: test insertion anchor not found')
          p.write_text(s.replace(anchor, test, 1))
          PY

      - name: Check Linux build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit experiment and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v41-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.rs src/server.rs src/buffer.rs .github/workflows/v41-one-shot.yml
          git commit -m 'perf: let reorder handle receive deduplication'
          git push origin HEAD:perf/reorder-dedup-v41
