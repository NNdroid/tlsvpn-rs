name: diagnostic real-TAP Rust client profile

on:
  push:
    branches:
      - diag/netperf-profile-v41

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Checkout Go control implementation
        uses: actions/checkout@v4
        with:
          repository: NNdroid/tlsvpn
          path: go-impl

      - name: Build native Rust and Go binaries
        shell: bash
        run: |
          bash scripts/build.sh native
          (cd go-impl && bash scripts/build.sh)

      - name: Probe perf permissions
        id: perfprobe
        shell: bash
        run: |
          set +e
          echo "perf=$(command -v perf || true)"
          uname -a
          cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 2>/dev/null || true
          sudo sysctl -w kernel.kptr_restrict=0 2>/dev/null || true
          sudo perf stat -e task-clock,context-switches,cpu-migrations,page-faults -- sleep 0.2 >/tmp/perf-probe.out 2>&1
          rc=$?
          cat /tmp/perf-probe.out
          if [[ $rc -eq 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: perf stat Rust client during real TAP traffic
        if: steps.perfprobe.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/perf-stat.txt /tmp/netperf-stat.log
          sudo -E env \
            BIN_SRV="$GITHUB_WORKSPACE/go-impl/bin/tlsvpn_linux_amd64" \
            BIN_CLI="$GITHUB_WORKSPACE/dist/tlsvpn" \
            FLAVOR_SRV=go FLAVOR_CLI=rs \
            bash scripts/net_perf_test.sh >/tmp/netperf-stat.log 2>&1 &
          test_pid=$!

          rust_pid=""
          for _ in $(seq 1 120); do
            rust_pid=$(pgrep -n -f "$GITHUB_WORKSPACE/dist/tlsvpn.*-c" || true)
            [[ -n "$rust_pid" ]] && break
            sleep 0.1
          done
          if [[ -z "$rust_pid" ]]; then
            cat /tmp/netperf-stat.log
            echo "Rust client PID not found" >&2
            exit 1
          fi
          echo "Rust client pid=$rust_pid"
          sudo perf stat -x, \
            -e task-clock,context-switches,cpu-migrations,page-faults,cycles,instructions,branches,branch-misses,cache-references,cache-misses \
            -p "$rust_pid" -o /tmp/perf-stat.txt -- sleep 8 || true
          wait "$test_pid"
          echo '--- netperf ---'
          cat /tmp/netperf-stat.log
          echo '--- perf stat ---'
          cat /tmp/perf-stat.txt || true

      - name: perf record Rust client hot functions
        if: steps.perfprobe.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/perf.data /tmp/perf-report.txt /tmp/netperf-record.log
          sudo -E env \
            BIN_SRV="$GITHUB_WORKSPACE/go-impl/bin/tlsvpn_linux_amd64" \
            BIN_CLI="$GITHUB_WORKSPACE/dist/tlsvpn" \
            FLAVOR_SRV=go FLAVOR_CLI=rs \
            bash scripts/net_perf_test.sh >/tmp/netperf-record.log 2>&1 &
          test_pid=$!

          rust_pid=""
          for _ in $(seq 1 120); do
            rust_pid=$(pgrep -n -f "$GITHUB_WORKSPACE/dist/tlsvpn.*-c" || true)
            [[ -n "$rust_pid" ]] && break
            sleep 0.1
          done
          if [[ -z "$rust_pid" ]]; then
            cat /tmp/netperf-record.log
            echo "Rust client PID not found" >&2
            exit 1
          fi
          echo "Rust client pid=$rust_pid"
          sudo perf record -F 199 -g --call-graph dwarf -p "$rust_pid" -o /tmp/perf.data -- sleep 8 || true
          wait "$test_pid"
          echo '--- netperf ---'
          cat /tmp/netperf-record.log
          echo '--- perf report ---'
          if [[ -s /tmp/perf.data ]]; then
            sudo perf report --stdio -i /tmp/perf.data --no-children --sort symbol --percent-limit 0.5 > /tmp/perf-report.txt || true
            sed -n '1,220p' /tmp/perf-report.txt
          else
            echo 'perf.data unavailable'
          fi

      - name: Fallback process counters when perf is blocked
        if: steps.perfprobe.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -E env \
            BIN_SRV="$GITHUB_WORKSPACE/go-impl/bin/tlsvpn_linux_amd64" \
            BIN_CLI="$GITHUB_WORKSPACE/dist/tlsvpn" \
            FLAVOR_SRV=go FLAVOR_CLI=rs \
            bash scripts/net_perf_test.sh >/tmp/netperf-fallback.log 2>&1 &
          test_pid=$!
          rust_pid=""
          for _ in $(seq 1 120); do
            rust_pid=$(pgrep -n -f "$GITHUB_WORKSPACE/dist/tlsvpn.*-c" || true)
            [[ -n "$rust_pid" ]] && break
            sleep 0.1
          done
          if [[ -n "$rust_pid" ]]; then
            echo "--- /proc/$rust_pid/status before ---"
            grep -E 'VmRSS|voluntary_ctxt_switches|nonvoluntary_ctxt_switches' "/proc/$rust_pid/status" || true
            echo "--- /proc/$rust_pid/stat before ---"
            cat "/proc/$rust_pid/stat" || true
            sleep 8
            echo "--- /proc/$rust_pid/status after ---"
            grep -E 'VmRSS|voluntary_ctxt_switches|nonvoluntary_ctxt_switches' "/proc/$rust_pid/status" || true
            echo "--- /proc/$rust_pid/stat after ---"
            cat "/proc/$rust_pid/stat" || true
          fi
          wait "$test_pid"
          cat /tmp/netperf-fallback.log
