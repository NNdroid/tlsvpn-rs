name: v37 one-shot server backlog poll

on:
  push:
    branches:
      - perf/server-backlog-poll-v37

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch server worker backlog poll behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/server.rs')
          s = p.read_text()

          old = '''        let mut poll_timeout = Duration::from_millis(250);
                  for sess in mio_sessions.values() {
                      if let Some(c_sess) = &sess.client_session {
                          if let Some(wait) = c_sess.reorder_buf.lock().next_timeout() {
                              poll_timeout = poll_timeout.min(wait);
                          }
                      }
                  }
                  poll.poll(&mut events, Some(poll_timeout))
                      .unwrap();
          '''
          new = '''        let mut poll_timeout = Duration::from_millis(250);
                  let mut tx_backlog_ready = false;
                  for sess in mio_sessions.values() {
                      if let Some(c_sess) = &sess.client_session {
                          if let Some(wait) = c_sess.reorder_buf.lock().next_timeout() {
                              poll_timeout = poll_timeout.min(wait);
                          }
                      }
                      if sess.handshake_done
                          && !sess.rx.is_empty()
                          && sess.write_stalled.is_none()
                          && !sess.tls.wants_write()
                      {
                          tx_backlog_ready = true;
                      }
                  }
                  poll_timeout = clamp_worker_poll_for_tx_backlog(poll_timeout, tx_backlog_ready);
                  poll.poll(&mut events, Some(poll_timeout))
                      .unwrap();
          '''
          if old not in s:
              raise SystemExit('worker poll anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''/// 工作线程：独立的 Poll / Waker / 会话表，处理分片到本线程的连接。
          /// 共享状态（会话注册表、交换机、IP 池、封禁表）均已线程安全。
          fn worker_loop(
          '''
          helper = '''#[inline]
          fn clamp_worker_poll_for_tx_backlog(base: Duration, tx_backlog_ready: bool) -> Duration {
              if tx_backlog_ready {
                  Duration::ZERO
              } else {
                  base
              }
          }

          #[cfg(test)]
          mod worker_poll_tests {
              use super::clamp_worker_poll_for_tx_backlog;
              use std::time::Duration;

              #[test]
              fn ready_tx_backlog_never_sleeps() {
                  assert_eq!(
                      clamp_worker_poll_for_tx_backlog(Duration::from_millis(250), true),
                      Duration::ZERO
                  );
              }

              #[test]
              fn no_ready_backlog_keeps_worker_deadline() {
                  let base = Duration::from_millis(17);
                  assert_eq!(clamp_worker_poll_for_tx_backlog(base, false), base);
              }
          }

          /// 工作线程：独立的 Poll / Waker / 会话表，处理分片到本线程的连接。
          /// 共享状态（会话注册表、交换机、IP 池、封禁表）均已线程安全。
          fn worker_loop(
          '''
          if anchor not in s:
              raise SystemExit('worker helper anchor not found')
          p.write_text(s.replace(anchor, helper, 1))
          PY

      - name: Check Linux build
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit experiment and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/v37-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.rs .github/workflows/v37-one-shot.yml
          git commit -m 'perf(server): avoid sleeping with queued TX backlog'
          git push origin HEAD:perf/server-backlog-poll-v37
