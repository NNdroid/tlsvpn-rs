name: One-shot backend parity

on:
  push:
    branches:
      - parity/go-main-20261001
    paths:
      - .github/workflows/parity-backend-temp.yml
      - scripts/parity_backend_temp.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rust parity branch
        uses: actions/checkout@v4
        with:
          ref: parity/go-main-20261001
          fetch-depth: 0

      - name: Checkout authoritative Go main
        uses: actions/checkout@v4
        with:
          repository: NNdroid/tlsvpn
          ref: main
          path: go-impl
          fetch-depth: 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply backend parity patch
        run: |
          python3 scripts/parity_backend_temp.py
          cp go-impl/config.server.json config.server.json
          cargo update -p rcgen
          cargo test --verbose

      - name: Verify persistent self-signed certificate behavior
        run: |
          cargo build
          tmp="$(mktemp -d)"
          cp config.server.json "$tmp/config.json"
          python3 - "$tmp/config.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p))
          d['psk']='backend-parity-test-secret'
          d['addr']='127.0.0.1:0'
          d['tap']='mem'
          d['web']={}
          d['server']['cert']=''
          d['server']['key']=''
          json.dump(d,open(p,'w'))
          PY
          bin="$GITHUB_WORKSPACE/target/debug/tlsvpn"
          (cd "$tmp" && timeout 2 "$bin" -c config.json || test $? -eq 124)
          test -s "$tmp/tlsvpn-selfsigned-cert.pem"
          test -s "$tmp/tlsvpn-selfsigned-key.pem"
          cert1="$(sha256sum "$tmp/tlsvpn-selfsigned-cert.pem" | awk '{print $1}')"
          (cd "$tmp" && timeout 2 "$bin" -c config.json || test $? -eq 124)
          cert2="$(sha256sum "$tmp/tlsvpn-selfsigned-cert.pem" | awk '{print $1}')"
          test "$cert1" = "$cert2"
          stat -c '%a' "$tmp/tlsvpn-selfsigned-key.pem" | grep -qx '600'
          stat -c '%a' "$tmp/tlsvpn-selfsigned-cert.pem" | grep -qx '644'

      - name: Commit product changes and self-clean
        run: |
          rm -f scripts/parity_backend_temp.py .github/workflows/parity-backend-temp.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'server: align TLS certificate defaults with Go'
          git push origin HEAD:parity/go-main-20261001
