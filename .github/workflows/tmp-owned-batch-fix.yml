name: Temporary owned batch drain fixes

on:
  push:
    branches: [ "protocol/v3-dynamic-fec" ]
    paths:
      - ".github/workflows/tmp-owned-batch-fix.yml"
      - "scripts/tmp_owned_batch_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: protocol/v3-dynamic-fec
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply drain fixes
        run: |
          python3 scripts/tmp_owned_batch_fix.py
          cargo fmt --all
          git diff --check
          git diff --stat

      - name: Compile all targets
        run: cargo check --all-targets

      - name: Core tests
        run: cargo test --all-targets --verbose

      - name: Owned batch regression tests
        run: cargo test --verbose owned_batch_queue -- --nocapture

      - name: Verify backlog and rustls budget guards
        run: |
          grep -q 'backend_tx_is_empty(Some(backend.as_ref()), &rx)' src/client.rs
          grep -q 'try_pop_fitting' src/net.rs
          grep -q 'STREAM_PAD_ABSOLUTE_LIMIT' src/client.rs
          grep -q 'STREAM_PAD_ABSOLUTE_LIMIT' src/server.rs

      - name: Commit production fixes
        run: |
          git config user.name "NNdroid"
          git config user.email "99177648+NNdroid@users.noreply.github.com"
          git add src/net.rs src/client.rs src/server.rs
          git commit -m "fix: bound owned batch TLS draining"
          git push origin HEAD:protocol/v3-dynamic-fec
