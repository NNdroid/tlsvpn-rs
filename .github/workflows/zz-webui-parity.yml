name: One-off Rust WebUI parity

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  align:
    if: github.head_ref == 'chore/webui-parity-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove merged Rust feature branch
        run: git push origin --delete feat/chacha-inner-aead || true

      - name: Copy authoritative Go WebUI
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/NNdroid/tlsvpn.git /tmp/tlsvpn-go
          rm -rf webui
          cp -a /tmp/tlsvpn-go/webui ./webui

      - name: Convert Rust dashboard to embedded shared assets
        run: |
          set -euxo pipefail
          python3 .github/scripts/oneoff_webui_parity.py
          sed -i 's/Response::from_data(body)/Response::from_data(body.to_vec())/' src/api.rs
          node --check webui/app.js
          cargo fmt --all
          git diff --check

      - name: Test Rust WebUI parity
        run: |
          set -euxo pipefail
          cargo test --all-targets
          cargo check --release

      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/zz-webui-parity.yml
          rm -f .github/scripts/oneoff_webui_parity.py
          git add -A
          git commit -m "feat(webui): align Rust dashboard with Go frontend"
          git push origin HEAD:main

      - name: Remove trigger branch
        if: always()
        run: git push origin --delete chore/webui-parity-trigger || true
