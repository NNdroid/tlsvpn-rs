name: Build and Release TLSVPN

on:
  push:
    tags:
      - 'v*' # 当 push 以 v 开头的 tag 时触发

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    
    steps:
      - uses: actions/checkout@v4

      # 安装交叉编译链
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          rustup target add ${{ matrix.target }}

      # 编译 Release 版本
      - name: Build
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: ${{ matrix.target }}
          args: "--release"
          strip: true

      - name: Rename artifact
        run: mv target/${{ matrix.target }}/release/tlsvpn target/${{ matrix.target }}/release/tlsvpn-${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlsvpn-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/tlsvpn-${{ matrix.target }}

  # 发布任务：等待所有 build 任务完成后执行
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限以创建 release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          body: "Automatic build for tag ${{ github.ref_name }}"
