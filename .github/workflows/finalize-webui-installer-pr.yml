name: Finalize WebUI parity PR helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/webui-install-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-install-parity
          fetch-depth: 0
      - name: Apply final patch
        run: python3 scripts/finalize_parity_patch.py
      - name: Remove one-shot helpers
        run: |
          git rm .github/workflows/finalize-webui-installer.yml
          git rm .github/workflows/finalize-webui-installer-pr.yml
          git rm scripts/finalize_parity_patch.py
      - name: Validate product changes
        run: |
          git diff --check
          chmod +x scripts/install.sh
          bash -n scripts/install.sh
          scripts/install.sh --help >/dev/null
          cargo test --all-targets
          cargo check --release
          grep -Fq 'webui/app.js' .github/workflows/crypto-interop.yml
          ! grep -Eq 'grep .*src/api\.rs' .github/workflows/crypto-interop.yml
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete WebUI traffic parity and installer safety'
          git push origin HEAD:feat/webui-install-parity
