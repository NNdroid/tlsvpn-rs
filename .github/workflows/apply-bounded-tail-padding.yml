name: Apply bounded tail padding

on:
  push:
    branches:
      - perf/bounded-tail-padding-20260929

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bounded-tail-padding-20260929
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python3 scripts/apply_bounded_tail_padding.py
      - name: Format touched source
        run: rustfmt src/frame.rs
      - name: Test bounded padding
        run: |
          cargo test stream_padding -- --nocapture
          cargo test stream_target_aligns_to_mss_budget -- --nocapture
      - name: Full test suite
        run: cargo test
      - name: Remove temporary helpers
        run: |
          rm -f scripts/apply_bounded_tail_padding.py
          rm -f .github/workflows/apply-bounded-tail-padding.yml
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf: bound MSS tail padding overhead"
          git push origin HEAD:perf/bounded-tail-padding-20260929
