[package]
name = "tlsvpn"
version = "0.1.0"
edition = "2021"

[dependencies]
tun-rs = "2"
mio = { version = "0.8", features = ["net", "os-poll"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
parking_lot = "0.12"
lazy_static = "1.4"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.8", features = ["v3", "v5"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"
getrandom = "0.2"
mimalloc = { version = "0.1", default-features = false }
tiny_http = "0.12"
base64ct = { version = "1.6", features = ["alloc"] }
ctrlc = "3"
dashmap = "5.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true