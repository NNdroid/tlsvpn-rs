[package]
name = "tlsvpn"
version = "0.1.0"
edition = "2021"

[dependencies]
tun-rs = "2"
mio = { version = "0.8", features = ["net", "os-poll"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
parking_lot = "0.12"
lazy_static = "1.4"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v3", "v5"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ring = "0.17"
getrandom = "0.2"
mimalloc = { version = "0.1", default-features = false }
# ssl-rustls：面板 HTTPS（web.cert / web.key）。不启用该 feature 时
# HttpServer::https 根本不存在，那两个配置值只能被解析后丢掉。
# tiny_http 内部用 rustls 0.20，与本项目的 0.23 各编一份，互不影响。
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
base64ct = { version = "1.6", features = ["alloc"] }
ctrlc = "3"
dashmap = "5.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true